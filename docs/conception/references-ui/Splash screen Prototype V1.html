<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BATORYA — Splash Screen Prototype V1</title>
<style>
:root{
  --orange:#dc6e29;
  --blue-soft:#5B86AE;
  --blue-deep:#2E5D8C;
  --orange-soft2:#C9823A;
  --text:#1B1C1E;
  --text-sec:#595C61;
  --bg:#E9EEF4;
  --bg-deep:#DCE5EF;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 18% 18%,rgba(53,105,158,.16),transparent 32%),
    radial-gradient(circle at 82% 78%,rgba(201,130,58,.13),transparent 30%),
    linear-gradient(135deg,var(--bg) 0%,#F4F6F9 48%,var(--bg-deep) 100%);
}
body:after{
  content:"";
  position:fixed;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(53,105,158,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(53,105,158,.035) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.65) 20%,rgba(0,0,0,.65) 80%,transparent 100%);
}
.stage{
  position:relative;width:100%;height:100%;
  display:grid;place-items:center;perspective:1600px;
}
.plan{
  position:absolute;inset:0;pointer-events:none;opacity:.52;
}
.plan:before,.plan:after{
  content:"";position:absolute;left:7%;right:7%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(46,93,140,.25),transparent);
}
.plan:before{top:25%}.plan:after{bottom:25%}
.cross{
  position:absolute;width:120px;height:120px;border:1px solid rgba(46,93,140,.14);
  border-radius:50%;left:14%;top:20%;
}
.cross:before,.cross:after{content:"";position:absolute;background:rgba(46,93,140,.13)}
.cross:before{width:160%;height:1px;left:-30%;top:50%}
.cross:after{height:160%;width:1px;top:-30%;left:50%}
.corner{
  position:absolute;width:180px;height:180px;border-top:1px solid rgba(46,93,140,.16);
  border-left:1px solid rgba(46,93,140,.16);
}
.corner.tl{left:9%;top:12%}.corner.br{right:9%;bottom:12%;transform:rotate(180deg)}
.dimension{
  position:absolute;color:rgba(46,93,140,.36);font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.12em;
}
.d1{left:10%;top:27%}.d2{right:10%;bottom:27%}
.panel-wrap{
  width:min(440px,90vw);
  transform-style:preserve-3d;
  transition:transform 900ms cubic-bezier(.22,1,.36,1),opacity 500ms ease;
}
.panel-wrap.flipped{transform:rotateY(180deg)}
.panel-wrap.exit{transform:rotateY(180deg) scale(.96);opacity:0}
.panel{
  position:relative;width:100%;min-height:360px;
  border-radius:20px;
  padding:46px 42px;
  background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(255,255,255,.60));
  border:1px solid rgba(255,255,255,.86);
  box-shadow:0 28px 70px rgba(46,93,140,.16),0 8px 24px rgba(27,28,30,.08);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  transform-style:preserve-3d;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.panel:before{
  content:"";position:absolute;left:20px;right:20px;top:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--blue-soft),var(--orange),var(--blue-soft));
  opacity:.9;
}
.panel.back{position:absolute;inset:0;transform:rotateY(180deg)}
.logo{
  font-weight:800;letter-spacing:.14em;font-size:31px;color:var(--blue-deep);
  line-height:1;
}
.logo .a{color:var(--orange)}
.logo-sub{
  margin-top:9px;font-size:11px;letter-spacing:.19em;text-transform:uppercase;
  color:var(--text-sec);
}
.splash-content{width:100%}
.loader{
  width:58px;height:58px;margin:34px auto 24px;
  border-radius:50%;
  border:2px solid rgba(46,93,140,.13);
  border-top-color:var(--orange);
  border-right-color:var(--blue-soft);
  animation:spin 1s linear infinite;
  position:relative;
}
.loader:after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  border:1px solid rgba(201,130,58,.18);
  border-bottom-color:var(--orange-soft2);
  animation:spinReverse 1.7s linear infinite;
}
.status{
  min-height:18px;font-size:13px;color:var(--text-sec);
  transition:opacity 220ms ease;
}
.version{
  margin-top:30px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:rgba(89,92,97,.72);letter-spacing:.08em;
}
.hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(89,92,97,.65);letter-spacing:.04em;
}
.demo{
  position:fixed;right:20px;bottom:18px;z-index:5;
  border:1px solid rgba(46,93,140,.16);background:rgba(255,255,255,.65);
  color:var(--text-sec);border-radius:9px;padding:8px 12px;font-size:11px;cursor:pointer;
  backdrop-filter:blur(10px);
}
.home{
  position:absolute;inset:0;display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity 650ms ease;
}
.home.visible{opacity:1}
.home-card{
  padding:42px 56px;border-radius:18px;background:rgba(255,255,255,.64);
  border:1px solid rgba(255,255,255,.82);box-shadow:0 20px 55px rgba(46,93,140,.12);
  text-align:center;backdrop-filter:blur(16px);
}
.home-card strong{font-size:22px;color:var(--blue-deep)}
.home-card p{margin:10px 0 0;color:var(--text-sec);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="plan" aria-hidden="true">
    <div class="corner tl"></div><div class="corner br"></div>
    <div class="cross"></div>
    <div class="dimension d1">A-01 / 2400</div>
    <div class="dimension d2">B-02 / 1800</div>
  </div>

  <div class="home" id="home">
    <div class="home-card">
      <strong>BATORYA Essentiel</strong>
      <p>Écran d’accueil — prototype</p>
    </div>
  </div>

  <div class="panel-wrap" id="panelWrap">
    <section class="panel" aria-hidden="true">
      <div>
        <div class="logo">BAT<span class="a">O</span>RYA</div>
        <div class="logo-sub">Essentiel</div>
      </div>
    </section>

    <section class="panel back" aria-live="polite">
      <div class="splash-content">
        <div class="logo">BAT<span class="a">O</span>RYA</div>
        <div class="logo-sub">Essentiel</div>
        <div class="loader" aria-label="Chargement"></div>
        <div class="status" id="status">Initialisation…</div>
        <div class="version">BATORYA Essentiel · V6.0.1.4</div>
      </div>
    </section>
  </div>

  <div class="hint">Prototype — cliquer sur le bouton pour rejouer</div>
  <button class="demo" id="replay">Rejouer</button>
</div>

<script>
const panelWrap=document.getElementById("panelWrap");
const status=document.getElementById("status");
const home=document.getElementById("home");
const replay=document.getElementById("replay");

const steps=[
  ["Initialisation…",650],
  ["Chargement de votre espace…",650],
  ["Préparation de BATORYA…",650]
];

let timers=[];

function clearTimers(){
  timers.forEach(clearTimeout);
  timers=[];
}

function runSplash(){
  clearTimers();
  panelWrap.classList.remove("exit","flipped");
  home.classList.remove("visible");
  status.textContent=steps[0][0];

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      panelWrap.classList.add("flipped");
    });
  });

  let elapsed=0;
  steps.forEach(([label,duration],index)=>{
    elapsed+=duration;
    if(index<steps.length-1){
      timers.push(setTimeout(()=>status.textContent=steps[index+1][0],elapsed));
    }
  });

  timers.push(setTimeout(()=>{
    panelWrap.classList.add("exit");
    home.classList.add("visible");
  },Math.max(elapsed,1950)));
}

replay.addEventListener("click",runSplash);
runSplash();
</script>
</body>
</html>
