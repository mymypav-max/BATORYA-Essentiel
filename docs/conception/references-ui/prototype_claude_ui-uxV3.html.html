 'devis-send':el=>{const d=dev(el.dataset.id);d.statut='Envoyé';d.hist.push([TODAY,'Envoyé par e-mail']);DB.act.unshift({date:TODAY,type:'mail',client:d.client,t:'Devis envoyé',s:`${d.id} transmis par e-mail.`});render();toast(`${d.id} envoyé à ${esc(cli(d.client).mail)} (simulation).`)},
 'devis-relance':el=>{const d=dev(el.dataset.id);d.hist.push([TODAY,'Relance envoyée']);DB.act.unshift({date:TODAY,type:'mail',client:d.client,t:'Relance devis',s:`${d.id} relancé.`});renderMain();toast(`Relance de ${d.id} envoyée (simulation).`)},
 'devis-refuse':el=>{const d=dev(el.dataset.id);d.statut='Refusé';d.hist.push([TODAY,'Refusé par le client']);render();toast(`${d.id} classé refusé.`,{action:['Annuler',()=>{d.statut='Envoyé';d.hist.pop();render()}]})},
 'devis-sign':el=>{const d=dev(el.dataset.id);d.statut='Signé';d.hist.push([TODAY,'Bon pour accord signé']);
   if(!d.ch){const id='CH-0'+(Math.max(...DB.chantiers.map(c=>+c.id.slice(3)))+1);DB.chantiers.push({id,client:d.client,devis:d.id,objet:d.objet,lieu:cli(d.client).adr,debut:addD(TODAY,14),fin:addD(TODAY,21),phases:[['Préparation et commandes',0],['Travaux',0],['Finitions',0],['Réception',0]],journal:[[TODAY,'Chantier ouvert à la signature du devis.']]});d.ch=id}
   if(cli(d.client).statut==='Prospect')cli(d.client).statut='Actif';
   render();toast(`${d.id} signé · chantier ${d.ch} ouvert.`,{action:['Voir le chantier',()=>go('travaux','chantiers',d.ch)]})},
 'devis-invoice':el=>{const d=dev(el.dataset.id),id=nextFac();DB.factures.push({id,client:d.client,objet:`Acompte 30 % — ${d.id}`,devis:d.id,pct:30,date:TODAY,ech:addD(TODAY,15),m:r2(tot(d.lines)*.3),pay:[],rel:[]});d.acompte=id;render();openFac(id);toast(`Facture d’acompte ${id} émise.`)},
 /* factures */
 'new-fac':()=>form('Nouvelle facture',[{k:'client',label:'Client',type:'select',options:cliOpts(),span:1},{k:'objet',label:'Objet',req:1,span:1},{k:'m',label:'Montant (€)',type:'number',req:1},{k:'ech',label:'Délai',type:'select',options:[['30','30 jours'],['15','15 jours'],['0','À réception']]}],v=>{const m=parseFloat(String(v.m).replace(',','.'));if(!(m>0)){toast('Montant invalide.',{err:1});return false}const id=nextNum(DB.factures,'BR-');DB.factures.push({id,brouillon:true,client:v.client,objet:v.objet,date:'',ech:'',delai:+v.ech,m:r2(m),pay:[],rel:[]});if(S.ch==='facturation')renderMain();openFac(id);toast('Brouillon créé : il recevra son numéro à l’émission.')},'Créer le brouillon',`Montant net · ${MENTION}.`),
 'fac-emit':el=>{const f=fac(el.dataset.id),id=nextFac();f.brouillon=false;f.id=id;f.date=TODAY;f.ech=addD(TODAY,f.delai??30);S.fac=id;refreshFac();render();toast(`Facture ${id} émise · échéance le ${fD(f.ech)}.`)},
 'fac-send':el=>{const f=fac(el.dataset.id);DB.act.unshift({date:TODAY,type:'mail',client:f.client,t:'Facture envoyée',s:`${f.id} transmise par e-mail.`});toast(`${f.id} envoyée à ${esc(cli(f.client).mail)} (simulation).`)},
 'mark-relance':el=>{const f=fac(el.dataset.id);f.rel.push(TODAY);DB.act.unshift({date:TODAY,type:'mail',client:f.client,t:`Relance ${f.id}`,s:`Relance n° ${f.rel.length}.`});S.done.add(f.id);refreshFac();renderMain();toast(`Relance n° ${f.rel.length} de ${f.id} consignée.`)},
 'new-mv':el=>{const d=ds(el),sens=d.sens||'out',cats=sens==='in'?['Règlement client','Autre recette']:['Fournitures','Outillage','Véhicule','Assurances','Frais généraux','Cotisations','Sous-traitance'];
   form(sens==='in'?'Saisir un encaissement':'Saisir une dépense',[{k:'lib',label:'Libellé',req:1,span:1},{k:'m',label:'Montant (€)',type:'number',req:1},{k:'date',label:'Date',type:'date',value:TODAY},{k:'cat',label:'Catégorie',type:'select',options:cats},{k:'mode',label:'Mode',type:'select',options:['Carte','Virement','Prélèvement','Chèque','Espèces']},{k:'tiers',label:sens==='in'?'Payeur':'Fournisseur'},{k:'ch',label:'Chantier',type:'select',options:[['','Aucun'],...DB.chantiers.map(c=>[c.id,`${c.id} — ${c.objet}`])],value:d.ch||''}],v=>{const m=parseFloat(String(v.m).replace(',','.'));if(!(m>0)){toast('Montant invalide.',{err:1});return false}
     DB.mouv.push({id:'M'+(++MID),date:v.date,sens,lib:v.lib,cat:v.cat,tiers:v.tiers,mode:v.mode,m:r2(m),ch:v.ch,rap:false});render();toast(`${sens==='in'?'Encaissement':'Dépense'} de ${eur(m)} consigné${sens==='in'?'':'e'} dans le livre de caisse.`,{action:S.ch!=='tresorerie'?['Voir',()=>go('tresorerie','livre')]:null})})},
 /* chantiers */
 phase:el=>{const c=chn(el.dataset.id),x=c.phases[+el.dataset.i];x[1]=x[1]?0:1;if(x[1])c.journal.unshift([TODAY,`Phase terminée : ${x[0]}.`]);renderMain();if(chSt(c)==='Terminé')toast('Toutes les phases sont terminées. Pensez au procès-verbal de réception.',{action:['Modèle',()=>go('documents','modeles')]})},
 'new-ch':()=>form('Nouveau chantier',[{k:'client',label:'Client',type:'select',options:cliOpts(),span:1},{k:'objet',label:'Objet',req:1,span:1},{k:'lieu',label:'Adresse',span:1,ph:'Par défaut : adresse du client'},{k:'debut',label:'Début',type:'date',value:addD(TODAY,7)},{k:'fin',label:'Fin prévue',type:'date',value:addD(TODAY,14)},{k:'budget',label:'Montant (€)',type:'number'}],v=>{if(v.fin<v.debut){toast('La fin précède le début.',{err:1});return false}const id='CH-0'+(Math.max(...DB.chantiers.map(c=>+c.id.slice(3)))+1);DB.chantiers.push({id,client:v.client,objet:v.objet,lieu:v.lieu||cli(v.client).adr,debut:v.debut,fin:v.fin,budget:parseFloat(String(v.budget).replace(',','.'))||0,phases:[['Préparation et commandes',0],['Travaux',0],['Finitions',0],['Réception',0]],journal:[[TODAY,'Chantier ouvert.']]});go('travaux','chantiers',id);toast(`Chantier ${id} ouvert.`)},'Ouvrir le chantier'),
 /* planning */
 week:el=>{const n=+el.dataset.d;S.week=n?addD(S.week,7*n):monday(TODAY);S.month=S.week.slice(0,7);renderMain()},
 month:el=>{const n=+el.dataset.d;if(!n)S.month=TODAY.slice(0,7);else{const[y,m]=S.month.split('-').map(Number);S.month=ISO(new Date(y,m-1+n,1)).slice(0,7)}renderMain()},
 day:el=>{S.week=monday(el.dataset.date);S.month=el.dataset.date.slice(0,7);go('planification','semaine')},
 slot:(el,e)=>{if(e.target.closest('.ev'))return;A['new-ev']({dataset:{date:el.dataset.date}})},
 'new-ev':el=>{const d=ds(el),s=d.time||'08:00',e=`${String(Math.min(20,Math.floor(hm(s))+2)).padStart(2,'0')}:${s.slice(3)}`;
   form('Planifier',[{k:'t',label:'Intitulé',req:1,span:1,ph:'Ex. Pose des plinthes'},{k:'type',label:'Nature',type:'select',options:[['chantier','Chantier'],['rdv','Rendez-vous'],['admin','Administratif']],value:d.ref&&d.ref.startsWith('CH')?'chantier':'rdv'},{k:'ref',label:'Lié à',type:'select',options:[['','Rien'],...DB.chantiers.filter(c=>chSt(c)!=='Terminé').map(c=>[c.id,`Chantier — ${c.objet}`]),...DB.clients.map(c=>[c.id,`Client — ${c.nom}`])],value:d.ref||''},{k:'date',label:'Date',type:'date',value:d.date||TODAY},{k:'s',label:'Début',type:'time',value:s},{k:'e',label:'Fin',type:'time',value:e}],v=>{if(v.e<=v.s){toast('L’heure de fin doit suivre le début.',{err:1});return false}
     const ov=DB.events.find(x=>x.date===v.date&&v.s<x.e&&v.e>x.s);DB.events.push({id:'E'+Date.now(),date:v.date,s:v.s,e:v.e,type:v.type,t:v.t,ref:v.ref});S.week=monday(v.date);S.month=v.date.slice(0,7);renderMain();
     toast(`Planifié ${fDl(v.date)}, ${v.s}–${v.e}.${ov?` Attention : chevauche « ${esc(ov.t)} ».`:''}`,{action:S.ch!=='planification'?['Voir la semaine',()=>go('planification','semaine')]:null})},'Planifier')},
 'ev-del':el=>{const i=DB.events.findIndex(x=>x.id===el.dataset.id),e=DB.events[i];DB.events.splice(i,1);closeModal();renderMain();toast('Intervention supprimée.',{action:['Annuler',()=>{DB.events.push(e);renderMain()}]})},
 /* catalogue & documents */
 'new-art':()=>{const f=S.tab==='fournitures',fams=[...new Set((f?FOURN:CAT).map(x=>x.fam))];
   form(f?'Nouvelle fourniture':'Nouvelle prestation',f?[{k:'code',label:'Référence',req:1},{k:'fam',label:'Famille',type:'select',options:fams},{k:'des',label:'Désignation',req:1,span:1},{k:'fourn',label:'Fournisseur',req:1},{k:'u',label:'Unité',value:'u'},{k:'pa',label:'Prix d’achat (€)',type:'number',req:1},{k:'pu',label:'Prix de vente (€)',type:'number',req:1}]:[{k:'code',label:'Code',req:1,ph:'Ex. PAR-04'},{k:'fam',label:'Famille',type:'select',options:fams},{k:'des',label:'Désignation',req:1,span:1},{k:'u',label:'Unité',type:'select',options:['m²','ml','u','h','forfait']},{k:'pu',label:'Prix (€)',type:'number',req:1}],v=>{
     const code=v.code.trim().toUpperCase();if([...CAT,...FOURN].some(x=>x.code===code)){toast('Ce code existe déjà.',{err:1});return false}
     const n=k=>parseFloat(String(v[k]).replace(',','.'))||0;
     if(f)FOURN.push({code,fam:v.fam,des:v.des,u:v.u,fourn:v.fourn,pa:n('pa'),pu:n('pu')});else CAT.push({code,fam:v.fam,des:v.des,u:v.u,pu:n('pu')});
     renderMain();toast(`${code} ajouté au ${f?'fichier des fournitures':'tarif'}.`)},'Ajouter')},
 'doc-import':()=>form('Importer un document',[{k:'file',label:'Fichier',type:'file',req:1,span:1},{k:'cat',label:'Classement',type:'select',options:DCAT},{k:'ch',label:'Chantier',type:'select',options:[['','Aucun'],...DB.chantiers.map(c=>[c.id,`${c.id} — ${c.objet}`])]}],(v,fm)=>{const file=fm.elements.file.files[0],ext=(file.name.split('.').pop()||'').toUpperCase(),type=['PDF','DOCX','XLSX'].includes(ext)?ext:/JPE?G|PNG|HEIC/.test(ext)?'JPG':'PDF',sz=file.size>1048576?`${(file.size/1048576).toFixed(1).replace('.',',')} Mo`:`${Math.max(1,Math.round(file.size/1024))} Ko`;
   DB.docs.push({id:'DOC'+Date.now(),nom:file.name.replace(/\.[^.]+$/,''),cat:v.cat,type,date:TODAY,taille:sz,lien:v.ch?{k:'ch',id:v.ch}:null});S.f.dcat='tous';if(S.ch!=='documents')go('documents','classeur');else renderMain();toast(`« ${esc(file.name)} » rangé dans ${v.cat}.`)},'Importer','Le fichier reste sur ce poste. Le prototype n’en conserve que le nom et la taille.'),
 'tpl-use':el=>{const t=TPL.find(x=>x.id===el.dataset.id);
   if(t.lines){newDraft('',t.lines.map(c=>L(c,1)));S.draft.objet=t.name.replace('Devis — ','').replace(/^./,c=>c.toUpperCase());go('commerce','devis',null,'edit');toast('Modèle chargé : choisissez le client et ajustez les quantités.');return}
   modal(`<div class="mo-hd"><div><span class="caps">${t.kind}</span><h2 style="margin-top:6px">${t.name}</h2></div>${closeX()}</div><div class="mo-bd prev"><div class="pv-page"><i class="h"></i><i style="width:62%"></i><i></i><i style="width:84%"></i><i></i><i style="width:48%"></i><i></i></div><div><p style="margin:0 0 12px;font:14.5px/1.6 var(--sans)">${t.desc}</p><p class="note">Les champs se remplissent depuis la pièce d’origine.</p></div></div><div class="mo-ft"><button class="btn quiet" data-act="close-modal">Fermer</button>${B('Générer le document','plus','pri','tpl-gen',`data-id="${t.id}"`)}</div>`,true)},
 'tpl-gen':el=>{const t=TPL.find(x=>x.id===el.dataset.id);DB.docs.push({id:'DOC'+Date.now(),nom:`${t.name} — ${fDs(TODAY)}`,cat:t.kind==='Chantier'?'Chantiers':'Administratif',type:'DOCX',date:TODAY,taille:'34 Ko',lien:null});closeModal();go('documents','classeur');toast(`« ${t.name} » généré et rangé.`)}
};
const LISTS={clients:clientRows,devis:devisList,ch:chList,fac:facList,livre:livreRows,tarif,docs:docRows,pick:pickRows};

/* ============================================================
   Thème & événements
   ============================================================ */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){document.documentElement.dataset.theme=S.set.theme==='system'?(mq&&mq.matches?'dark':'light'):S.set.theme}
function setTheme(t){S.set.theme=t;store.set('theme',t);applyTheme();renderTop();closePop();if(S.ch==='parametres')renderMain();toast(t==='dark'?'Thème Encre.':t==='light'?'Thème Papier.':'Thème du système.')}
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(S.set.theme==='system'){applyTheme();renderTop()}});

document.addEventListener('click',e=>{
  const pi=e.target.closest('[data-pi]');if(pi){palRun(+pi.dataset.pi);return}
  if($('#pop').classList.contains('on')&&!e.target.closest('#pop')&&!e.target.closest('[data-act="pop"]'))closePop();
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='palIn')return palFilter(t.value);
  if(t.dataset.search){S.q[t.dataset.search]=t.value;const el=$('#list-'+t.dataset.search);if(el)el.innerHTML=LISTS[t.dataset.search]();return}
  if(t.dataset.lf!=null&&S.draft){const i=+t.dataset.line,k=t.dataset.lf,l=S.draft.lines[i];if(!l)return;l[k]=['q','pu'].includes(k)?(parseFloat(t.value)||0):t.value;const c=$('#lt-'+i);if(c)c.textContent=eur((+l.q||0)*(+l.pu||0));$('#ed-tot').innerHTML=totHTML();return}
  if(t.dataset.dfield&&S.draft){S.draft[t.dataset.dfield]=t.value;t.classList.remove('err');return}
  if(t.dataset.note){cli(t.dataset.note).notes=t.value;const s=$('#note-st');if(s){s.textContent='Enregistrement…';clearTimeout(s._t);s._t=setTimeout(()=>s.textContent='Enregistrées à l’instant',400)}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.price){const it=[...CAT,...FOURN].find(x=>x.code===t.dataset.price),v=parseFloat(t.value.replace(',','.'));if(isNaN(v)||v<0){t.value=it.pu.toFixed(2).replace('.',',');toast('Prix invalide.',{err:1});return}it.pu=r2(v);t.value=it.pu.toFixed(2).replace('.',',');toast(`${it.code} : nouveau prix ${eur(it.pu)}. Il s’appliquera aux prochains devis.`);if(S.tab==='fournitures')$('#list-tarif').innerHTML=tarif()}
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='leF'){e.preventDefault();const v=$('#leonIn').value.trim();if(v)leonAsk(v);return}
  if(f.dataset.pay){e.preventDefault();const fa=fac(f.dataset.pay),fd=new FormData(f),m=r2(parseFloat(fd.get('m')));
    if(!(m>0)||m>fReste(fa)+.005){toast(`Montant invalide (maximum ${eur(fReste(fa))}).`,{err:1});return}
    fa.pay.push({date:fd.get('d'),m,mode:fd.get('mode')});DB.mouv.push({id:'M'+(++MID),date:fd.get('d'),sens:'in',lib:`Règlement ${fa.id}`,cat:'Règlement client',client:fa.client,mode:fd.get('mode'),m,fac:fa.id,ch:chOfDevis(fa.devis),rap:false});
    refreshFac();render();toast(`Règlement de ${eur(m)} enregistré · facture ${fSt(fa).toLowerCase()}.`);return}
  if(f.dataset.journal){e.preventDefault();const v=f.elements.t.value.trim();if(!v){f.elements.t.classList.add('err');return}chn(f.dataset.journal).journal.unshift([TODAY,v]);renderMain();toast('Note consignée au journal.')}
});
document.addEventListener('keydown',e=>{
  const k=e.key,pal=$('#palW').classList.contains('on');
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();pal?palClose():palOpen();return}
  if(pal){if(k==='ArrowDown'){e.preventDefault();PAL.sel=Math.min(PAL.items.length-1,PAL.sel+1);palDraw()}else if(k==='ArrowUp'){e.preventDefault();PAL.sel=Math.max(0,PAL.sel-1);palDraw()}else if(k==='Enter'){e.preventDefault();palRun(PAL.sel)}else if(k==='Escape')palClose();return}
  if(k==='Escape'){if($('#modalW').classList.contains('on'))return closeModal();if(S.fac)return closeSheet();if($('#sommaire').classList.contains('on'))return closeSom();if($('#pop').classList.contains('on'))return closePop();if(S.leon)return leonToggle(false)}
  if(e.altKey&&!e.ctrlKey&&!e.metaKey){if(/^Digit[0-9]$/.test(e.code)){e.preventDefault();go(ORDER[+e.code.slice(5)])}else if(e.code==='KeyL'){e.preventDefault();leonToggle()}}
});
$('#modalW').addEventListener('mousedown',e=>{if(e.target.id==='modalW')closeModal()});
$('#palW').addEventListener('mousedown',e=>{if(e.target.id==='palW')palClose()});

/* ============================================================
   Démarrage
   ============================================================ */
applyTheme();
document.documentElement.dataset.density=S.set.density;
if(S.set.motion)document.documentElement.dataset.motion='reduce';
render(true);
})();
</script>
</body>
