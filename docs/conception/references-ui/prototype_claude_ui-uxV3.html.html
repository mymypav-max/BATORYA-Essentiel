<!doctype html>
<html lang="fr" data-theme="light" data-density="confort">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATORYA Essentiel V6 — « Registre » V3 (variante typographique)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BATORYA Essentiel V6 — « Registre » V3
   Variante typographique : Source Serif 4 pour les titres,
   Instrument Sans pour le contenu, DM Mono pour les données.
   Papier & encre outremer. Typographie éditoriale, filets fins,
   marge contextuelle, frise du mois. Pas de cartes, pas de sidebar.
   ============================================================ */
:root{
  --serif:"Source Serif 4","Source Serif Pro",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:3px; --row:48px; --marg:240px; --ease:cubic-bezier(.22,.7,.2,1);
}
[data-theme="light"]{
  color-scheme:light;
  --paper:#F6F6F2; --sheet:#FFFFFF; --wash:#EEEEE8; --wash-2:#E7E7E0;
  --rule:#D6D6CC; --rule-2:#E6E6DE;
  --ink:#14161B; --ink-2:#43464E; --ink-3:#6C6F77; --on-ink:#F6F6F2;
  --blue:#2B38D0; --blue-2:#1E29A8; --blue-wash:#E6E8FA; --blue-ink:#FFFFFF;
  --red:#C23B24; --red-wash:#F7E1DB; --green:#287047; --green-wash:#DDEDE2; --amber:#9E6B0B; --amber-wash:#F4E9CF;
  --doc:#FFFFFF; --doc-ink:#14161B; --doc-rule:#E3E3DA;
  --shadow:0 1px 1px rgba(20,22,27,.04),0 12px 32px -12px rgba(20,22,27,.18);
  --scrim:rgba(20,22,27,.28);
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1016; --sheet:#151821; --wash:#191D27; --wash-2:#212634;
  --rule:#2A2F3D; --rule-2:#1F2330;
  --ink:#E8E6DF; --ink-2:#B8B7B1; --ink-3:#8A8D96; --on-ink:#0E1016;
  --blue:#8F9CFF; --blue-2:#AAB4FF; --blue-wash:rgba(143,156,255,.12); --blue-ink:#0B0E1E;
  --red:#F0897A; --red-wash:rgba(240,137,122,.13); --green:#7DC79A; --green-wash:rgba(125,199,154,.12); --amber:#E0B460; --amber-wash:rgba(224,180,96,.12);
  --doc:#EAE8E1; --doc-ink:#14161B; --doc-rule:#CFCDC4;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 16px 40px -12px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.5);
}
[data-density="compact"]{--row:38px}
[data-motion="reduce"] *,[data-motion="reduce"] *::before,[data-motion="reduce"] *::after{transition:none!important;animation:none!important}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;font-optical-sizing:auto}
.fig b,.amts b,.bigpc b,.ch-e .pc,.ag .d b,.wd-h b,.mo-c b,.m-num,.num-big{font-variant-numeric:lining-nums tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--blue-wash)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.serif{font-family:var(--serif)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{text-align:right;white-space:nowrap}
.mut{color:var(--ink-3)} .t-red{color:var(--red)} .t-green{color:var(--green)} .t-amber{color:var(--amber)} .t-blue{color:var(--blue)}
.caps{font:600 11px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
em.it{font-family:var(--serif);font-style:italic}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cadre ---------- */
.shell{display:grid;grid-template-rows:64px minmax(0,1fr);height:100vh}
.top{display:flex;align-items:stretch;gap:26px;padding:0 28px;border-bottom:1px solid var(--rule);background:var(--paper);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:11px;border:0;background:none;padding:0;color:var(--ink);text-align:left}
.mark{width:30px;height:30px;border:1.5px solid var(--ink);display:grid;place-items:center;font:italic 500 18px/1 var(--serif);position:relative}
.mark::after{content:"";position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--blue)}
.brand .bt b{display:block;font:600 19px/1 var(--serif);letter-spacing:-.005em}
.brand .bt span{display:block;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.nav{display:flex;align-items:stretch;gap:2px;flex:1;min-width:0}
.nv{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 10px;border:0;background:none;color:var(--ink-2);white-space:nowrap;transition:color .15s}
.nv sup{font:500 10px var(--mono);color:var(--ink-3);letter-spacing:.06em;line-height:1;margin-bottom:3px}
.nv span{font-size:13.5px;font-weight:500;line-height:1}
.nv:hover{color:var(--ink)}
.nv.on{color:var(--ink)}
.nv.on sup{color:var(--blue)}
.nv.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--blue)}
.nv .dot{position:absolute;top:13px;right:2px;width:6px;height:6px;background:var(--red)}
.nv-sep{width:1px;background:var(--rule);margin:18px 6px}
.tools{display:flex;align-items:center;gap:6px}
.find{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);color:var(--ink-3);min-width:210px;text-align:left}
.find span{flex:1;font-size:13px}
.find:hover{border-color:var(--ink-3);color:var(--ink-2)}
kbd{font:500 10.5px var(--mono);color:var(--ink-3);border:1px solid var(--rule);padding:1px 5px;border-radius:2px;background:var(--paper)}
.ib{width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:var(--r);color:var(--ink-2)}
.ib:hover{border-color:var(--rule);background:var(--sheet);color:var(--ink)}
.who{width:36px;height:36px;border-radius:50%;border:1px solid var(--ink);background:var(--sheet);font:600 12px var(--mono);display:grid;place-items:center;margin-left:4px}
.sommaire-btn{display:none}
.scroll{overflow:auto;min-height:0;scroll-behavior:smooth}

/* ---------- page à marge ---------- */
.layout{display:grid;grid-template-columns:var(--marg) minmax(0,1fr);gap:56px;max-width:1480px;margin:0 auto;padding:36px 44px 96px}
.margin{position:sticky;top:36px;align-self:start;display:flex;flex-direction:column}
.m-num{font:300 88px/.88 var(--serif);letter-spacing:-.035em;color:var(--ink-3)}
.m-name{font:500 29px/1.15 var(--serif);letter-spacing:-.012em;margin:14px 0 6px}
.m-desc{margin:0;color:var(--ink-3);font-size:13.5px;line-height:1.55}
.m-head-s{display:flex;align-items:baseline;gap:10px}
.m-head-s .m-num{font-size:44px}
.m-head-s .m-name{font-size:20px;margin:0}
.m-nav{margin:26px 0 0;border-top:1px solid var(--ink)}
.m-nav button{display:flex;align-items:center;width:100%;height:42px;padding:0;border:0;border-bottom:1px solid var(--rule-2);background:none;text-align:left;color:var(--ink-2);gap:10px;transition:color .15s}
.m-nav button span{flex:1}
.m-nav button em{font:normal 500 11px var(--mono);color:var(--ink-3)}
.m-nav button:hover{color:var(--ink)}
.m-nav button::before{content:"";width:6px;height:6px;background:transparent;flex:none;transition:background .15s}
.m-nav button.on{color:var(--ink);font-weight:600}
.m-nav button.on::before{background:var(--blue)}
.m-block{margin-top:28px}
.m-block .caps{display:block;margin-bottom:8px}
.m-acts{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.m-acts .btn{justify-content:flex-start;width:100%}
.back{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:var(--ink-2);font-weight:500;margin-bottom:22px}
.back:hover{color:var(--blue)}
.minical{margin-top:26px}
.mc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mc-h b{font:600 15px var(--serif)}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mc span{font:500 10px var(--mono);color:var(--ink-3);padding:3px 0}
.mc button{height:28px;border:0;background:none;font:400 12px var(--mono);color:var(--ink-2);border-radius:2px;position:relative}
.mc button:hover{background:var(--wash)}
.mc button.out{color:var(--ink-3);opacity:.5}
.mc button.wk{background:var(--blue-wash);color:var(--ink)}
.mc button.td{color:var(--blue);font-weight:500}
.mc button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:3px;height:3px;margin-left:-1.5px;background:var(--ink-3)}
.body{min-width:0}
.view-in{animation:vin .3s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}

/* ---------- titres de page ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:3px double var(--rule);margin-bottom:22px;flex-wrap:wrap}
.ph h1{font:400 37px/1.12 var(--serif);letter-spacing:-.015em;margin:0}
.ph h1 em{font-style:italic;color:var(--ink-3)}
.ph .sub{color:var(--ink-3);margin-top:8px;font-size:14px}
.ph-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- contrôles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 15px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:var(--r);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--ink);color:var(--on-ink)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.pri:hover{background:var(--blue-2);border-color:var(--blue-2)}
.btn.quiet{border-color:var(--rule)}
.btn.quiet:hover{background:var(--wash);color:var(--ink);border-color:var(--ink-3)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;gap:6px}
.btn.danger{color:var(--red);border-color:var(--rule)}
.btn.danger:hover{background:var(--red-wash);color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn kbd{margin-left:4px;background:transparent;border-color:currentColor;color:inherit;opacity:.6}
.lk{border:0;background:none;padding:0;color:var(--blue);font:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.lk:hover{text-decoration-color:var(--blue)}
.go-arrow{border:0;background:none;padding:0;color:var(--ink-2);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.go-arrow:hover{color:var(--blue)}
.in{width:100%;height:38px;border:0;border-bottom:1px solid var(--rule);background:transparent;border-radius:0;padding:0 2px;transition:border-color .15s,box-shadow .15s}
.in:hover{border-bottom-color:var(--ink-3)}
.in:focus{outline:none;border-bottom-color:var(--blue);box-shadow:0 1px 0 var(--blue)}
textarea.in{height:auto;padding:8px 2px;resize:vertical;line-height:1.55}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 11px) 52%,calc(100% - 6px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.in.err{border-bottom-color:var(--red);box-shadow:0 1px 0 var(--red)}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld>span{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fld.span2{grid-column:1/-1}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 26px}
.search{position:relative;width:280px;max-width:100%}
.search svg{position:absolute;left:2px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .in{padding-left:26px}
.filters{display:flex;gap:2px;flex-wrap:wrap}
.fl{height:30px;padding:0 10px;border:0;border-bottom:1px solid transparent;background:none;color:var(--ink-3);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:color .15s}
.fl em{font:normal 500 11px var(--mono)}
.fl:hover{color:var(--ink)}
.fl.on{color:var(--ink);border-bottom:2px solid var(--ink)}
.bar-tools{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.switch{width:36px;height:20px;border-radius:10px;border:0;background:var(--rule);position:relative;flex:none;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--sheet);transition:left .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--blue)} .switch.on::after{left:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r)}
.seg button{height:30px;padding:0 12px;border:0;background:none;color:var(--ink-3);font-size:12.5px;font-weight:500;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--on-ink)}

/* ---------- registre (listes) ---------- */
.reg{width:100%;border-collapse:collapse}
.reg th{font:600 10.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
.reg th.num{text-align:right}
.reg td{height:var(--row);padding:0 12px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.reg td:first-child,.reg th:first-child{padding-left:0}
.reg td:last-child,.reg th:last-child{padding-right:0}
.reg tr.go{cursor:pointer;transition:background .12s}
.reg tr.go:hover td{background:var(--wash)}
.reg tr.go:hover td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.reg .nm{font:600 15px/1.35 var(--sans);letter-spacing:-.003em}
.reg small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.4}
.reg .ref{font:500 12px var(--mono);color:var(--ink-3);white-space:nowrap}
.reg .ell{max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg tfoot td{border-bottom:0;border-top:1px solid var(--ink);font-weight:600;height:44px}
.grp{margin-top:30px}
.grp:first-child{margin-top:0}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:8px}
.grp-h h2{margin:0;font:italic 400 22px/1.25 var(--serif);letter-spacing:0}
.grp-h h2 em{font:normal 500 12px var(--mono);color:var(--ink-3);margin-left:10px;vertical-align:3px}
.grp-h .num{font-size:15px}
.st{display:inline-flex;align-items:center;gap:7px;font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;background:currentColor;flex:none}
.st.ok{color:var(--green)} .st.bad{color:var(--red)} .st.wait{color:var(--amber)} .st.info{color:var(--blue)} .st.mute{color:var(--ink-3)} .st.mute::before{background:transparent;border:1px solid currentColor}
.empty{padding:36px 0;color:var(--ink-3);font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5}
.line{height:2px;background:var(--rule-2);position:relative;flex:1;min-width:60px}
.line i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .5s var(--ease)}
.line.blue i{background:var(--blue)} .line.green i{background:var(--green)}
.ld{display:flex;align-items:baseline;gap:8px;padding:7px 0;font-size:13.5px}
.ld>span:first-child{white-space:nowrap;color:var(--ink-2)}
.ld i{flex:1;border-bottom:1px dotted var(--ink-3);opacity:.7;transform:translateY(-4px);min-width:14px}
.ld b{font:500 13.5px var(--mono);white-space:nowrap}
.ld.big{padding-top:12px;margin-top:6px;border-top:1px solid var(--ink)}
.ld.big>span:first-child{color:var(--ink);font-weight:600}
.ld.big b{font-size:16px}

/* ---------- accueil ---------- */
.home{max-width:1480px;margin:0 auto;padding:40px 44px 110px}
.dateline{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.dateline .caps{color:var(--ink-2)}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.headline{font:400 44px/1.2 var(--serif);letter-spacing:-.018em;margin:34px 0 12px;max-width:1080px}
.headline .lk{font-weight:600;color:var(--ink);text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:6px}
.headline .lk:hover{color:var(--blue)}
.headline .lk.red{text-decoration-color:var(--red)}
.lede{color:var(--ink-2);font-size:15.5px;line-height:1.6;max-width:760px;margin:0 0 34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:3px double var(--rule);padding-top:14px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{margin:0;font:italic 400 24px/1.25 var(--serif);letter-spacing:0}
.sec-h .caps{color:var(--ink-3)}
/* frise */
.frise{position:relative;margin-bottom:44px;--lab:168px}
.fr-cols{position:absolute;left:var(--lab);right:0;top:0;bottom:0;display:grid;grid-template-columns:repeat(31,minmax(0,1fr));pointer-events:none}
.fr-cols i{border-left:1px solid var(--rule-2)}
.fr-cols i.we{background:var(--wash)}
.fr-row{position:relative;display:grid;grid-template-columns:var(--lab) repeat(31,minmax(0,1fr));align-items:center;min-height:38px;border-bottom:1px solid var(--rule-2)}
.fr-row>*{grid-row:1}
.fr-row:last-child{border-bottom:1px solid var(--ink)}
.fr-lab{font-size:13px;color:var(--ink-2);padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-lab b{font:600 13.5px var(--sans);color:var(--ink)}
.fr-head{min-height:30px;border-bottom:1px solid var(--ink)}
.fr-head .d{text-align:center;font:500 10.5px var(--mono);color:var(--ink-3);position:relative;z-index:1}
.fr-head .d.td{color:var(--blue);font-weight:600}
.fr-bar{position:relative;z-index:1;height:16px;border:0;padding:0;background:var(--blue-wash);border-left:2px solid var(--blue);display:flex;align-items:center;overflow:hidden;margin:0 1px}
.fr-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);opacity:.9}
.fr-bar span{position:relative;font:500 10.5px var(--mono);padding-left:6px;color:var(--ink);white-space:nowrap;mix-blend-mode:normal}
.fr-bar.done{background:var(--green-wash);border-left-color:var(--green)}
.fr-bar.done i{background:var(--green)}
.fr-bar.plan{background:transparent;border:1px dashed var(--blue);border-left:2px solid var(--blue)}
.fr-mk{position:relative;z-index:2;justify-self:center;width:11px;height:11px;border:0;padding:0;transform:rotate(45deg);background:var(--ink);transition:transform .15s}
.fr-mk:hover{transform:rotate(45deg) scale(1.35)}
.fr-mk.bad{background:var(--red)} .fr-mk.ok{background:var(--green)} .fr-mk.wait{background:var(--amber)} .fr-mk.info{background:var(--blue)} .fr-mk.hollow{background:transparent;border:1.5px solid var(--ink-2)}
.fr-dot{position:relative;z-index:2;justify-self:center;width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--ink)}
.fr-dot:hover{transform:scale(1.3)}
.fr-today{position:absolute;top:0;bottom:-8px;width:0;border-left:1.5px solid var(--blue);z-index:3;pointer-events:none}
.fr-today span{position:absolute;bottom:-18px;left:-22px;width:44px;text-align:center;font:600 9.5px var(--mono);color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
.fr-legend{display:flex;gap:18px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.fr-legend span{display:inline-flex;align-items:center;gap:7px}
.fr-legend i{display:inline-block;width:9px;height:9px}
/* trois colonnes */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.col{padding:20px 26px 10px;border-left:1px solid var(--rule)}
.col:first-child{padding-left:0;border-left:0}
.col:last-child{padding-right:0}
.col-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.col-h h3{margin:0;font:italic 400 22px/1.25 var(--serif)}
.col-h em{font:normal 500 12px var(--mono);color:var(--ink-3)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--rule-2);align-items:baseline}
.entry:last-child{border-bottom:0}
.entry .e-t{font:600 15px/1.4 var(--sans)}
.entry .e-s{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.entry .e-a{grid-column:1/-1;display:flex;gap:14px;margin-top:4px}
.entry.click{cursor:pointer}
.entry.click:hover .e-t{color:var(--blue)}
.ch-e{padding:14px 0;border-bottom:1px solid var(--rule-2);cursor:pointer;display:block;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:none}
.ch-e:hover .e-t{color:var(--blue)}
.ch-e .e-t{font:600 15px/1.4 var(--sans)}
.ch-e .row{display:flex;align-items:center;gap:12px;margin-top:10px}
.ch-e .pc{font:400 22px/1 var(--serif);min-width:56px;text-align:right}
.ch-e .e-s{font-size:12.5px;color:var(--ink-3)}
.ag{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--rule-2);cursor:pointer}
.ag:hover .e-t{color:var(--blue)}
.ag .d{text-align:left}
.ag .d b{display:block;font:400 29px/1 var(--serif);letter-spacing:-.015em}
.ag .d span{font:600 10px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.ag .e-t{font:600 14.5px/1.4 var(--sans)}
.ag .e-s{font-size:12.5px;color:var(--ink-3)}
.ag .e-s .mono{color:var(--ink-2)}
.ledger2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;margin-top:44px}
.gauge{position:relative;height:44px;margin:16px 0 8px}
.gauge .tr{position:absolute;left:0;right:0;top:14px;height:10px;background:var(--wash-2)}
.gauge .fi{position:absolute;left:0;top:14px;height:10px;background:var(--ink)}
.gauge .fi.warn{background:var(--amber)}
.gauge .tk{position:absolute;top:28px;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 1px,transparent 1px 10%);opacity:.6}
.gauge .lim{position:absolute;top:6px;bottom:0;border-left:1.5px dashed var(--red)}
.gauge .lim span{position:absolute;top:-16px;right:6px;font:600 9.5px var(--mono);color:var(--red);white-space:nowrap;letter-spacing:.06em}
.note{font-size:13px;line-height:1.5;color:var(--ink-3);font-style:italic;font-family:var(--serif);margin-top:10px}

/* ---------- fiches ---------- */
.idh{padding-bottom:22px;border-bottom:3px double var(--rule);margin-bottom:26px}
.idh h1{font:400 42px/1.12 var(--serif);letter-spacing:-.018em;margin:8px 0 14px}
.idh .meta{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;color:var(--ink-2);font-size:13.5px}
.idh .meta button{border:0;background:none;padding:0;color:inherit;display:inline-flex;gap:7px;align-items:center}
.idh .meta button:hover{color:var(--blue)}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:48px;align-items:start}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-bottom:30px}
.fig{padding:14px 18px 16px;border-left:1px solid var(--rule-2)}
.fig:first-child{border-left:0;padding-left:0}
.fig .caps{display:block}
.fig b{display:block;font:400 27px/1.2 var(--serif);letter-spacing:-.01em;margin-top:8px;white-space:nowrap}
.fig small{color:var(--ink-3);font-size:12px}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.tl li{display:grid;grid-template-columns:86px 18px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule-2)}
.tl li.click{cursor:pointer}
.tl li.click:hover b{color:var(--blue)}
.tl time{font:500 11.5px var(--mono);color:var(--ink-3)}
.tl .k{width:8px;height:8px;background:var(--ink-3);transform:translateY(-1px)}
.tl .k.devis{background:var(--blue)} .tl .k.fac{background:var(--ink)} .tl .k.note{background:transparent;border:1px solid var(--ink-3);border-radius:50%} .tl .k.ch{background:var(--amber)}
.tl b{font-weight:500}
.tl small{display:block;color:var(--ink-3);font-size:12.5px}
.notes{width:100%;min-height:140px;border:1px solid var(--rule);background:var(--sheet);padding:12px 14px;font:15px/1.65 var(--sans);border-radius:var(--r);resize:vertical}
.notes:focus{outline:none;border-color:var(--blue)}
.phases{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.phases li{display:grid;grid-template-columns:28px 40px minmax(0,1fr) auto;align-items:center;gap:6px;min-height:50px;border-bottom:1px solid var(--rule-2)}
.ck{width:18px;height:18px;border:1.5px solid var(--ink-3);background:none;padding:0;display:grid;place-items:center;color:transparent;transition:.15s}
.ck svg{width:12px;height:12px;stroke-width:2.4}
.ck:hover{border-color:var(--blue)}
.ck.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.phases .n{font:500 11px var(--mono);color:var(--ink-3)}
.phases .p{font:400 15px/1.45 var(--sans)}
.phases li.done .p{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}
.phases li.next .p{font-weight:600}
.phases .nx{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.bigpc{display:flex;align-items:flex-end;gap:22px;margin:4px 0 30px}
.bigpc b{font:300 82px/.9 var(--serif);letter-spacing:-.03em}
.bigpc b small{font-size:30px;color:var(--ink-3);margin-left:4px}
.bigpc .rhs{flex:1;padding-bottom:10px}
.bigpc .dates{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--ink-3);margin-top:10px}
.journal{list-style:none;margin:0;padding:0}
.journal li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px dotted var(--rule)}
.journal time{font:500 11.5px var(--mono);color:var(--ink-3);padding-top:2px}
.journal p{margin:0;font:400 14.5px/1.6 var(--sans)}
.jform{display:flex;gap:12px;align-items:flex-end;margin:6px 0 10px}

/* ---------- document commercial ---------- */
.desk{background:var(--wash);border-top:1px solid var(--ink);padding:36px 32px 48px}
.doc{background:var(--doc);color:var(--doc-ink);max-width:820px;margin:0 auto;padding:56px 60px 46px;box-shadow:var(--shadow);font-size:13px;line-height:1.5;position:relative}
.doc::before{content:"";position:absolute;left:0;top:0;width:100%;height:6px;background:#2B38D0}
.d-top{display:flex;justify-content:space-between;gap:28px}
.d-co b{display:block;font:600 17px/1.25 var(--serif)}
.d-co span{display:block;color:#585b63;font-size:11.5px}
.d-kind{text-align:right}
.d-kind h2{margin:0;font:300 40px/1.05 var(--serif);letter-spacing:-.01em}
.d-kind .mono{font-size:13px;color:#2B38D0;margin-top:6px;display:block}
.d-kind span{display:block;font-size:11.5px;color:#585b63}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px;padding-top:18px;border-top:1px solid #14161B}
.d-lbl{display:block;font:600 9px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#8a8c93;margin-bottom:5px}
.d-grid b{font:600 15px var(--serif)}
.d-grid span{display:block;color:#454850}
.d-t{width:100%;border-collapse:collapse;margin-top:28px}
.d-t th{font:600 9px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#8a8c93;text-align:left;padding:8px 6px;border-bottom:1px solid #14161B}
.d-t td{padding:10px 6px;border-bottom:1px solid var(--doc-rule);vertical-align:top}
.d-t .r{text-align:right;white-space:nowrap}
.d-t td.r{font-family:var(--mono);font-size:12.5px}
.d-t .c{display:block;font:500 9.5px var(--mono);color:#8a8c93}
.d-sum{margin:18px 0 0 auto;width:300px}
.d-sum div{display:flex;justify-content:space-between;padding:4px 0;font-family:var(--mono);font-size:12.5px}
.d-sum div span:first-child{font-family:var(--sans)}
.d-sum .tot{border-top:2px solid #14161B;margin-top:6px;padding-top:10px;font-size:15px;font-weight:500}
.d-sum .tot span:first-child{font:600 15px var(--serif)}
.d-sum .mention{font:italic 12px var(--serif);color:#454850;justify-content:flex-end}
.d-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
.d-sign div{border-top:1px solid #14161B;padding-top:8px;height:72px;font-size:10.5px;color:#8a8c93}
.d-foot{margin-top:20px;font-size:10px;color:#6b6e76;line-height:1.6}

/* ---------- éditeur ---------- */
.ed-lines{width:100%;border-collapse:collapse;margin-top:6px}
.ed-lines th{font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:0 8px 10px;border-bottom:1px solid var(--ink)}
.ed-lines th.num{text-align:right}
.ed-lines td{padding:6px 8px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.ed-lines td:first-child,.ed-lines th:first-child{padding-left:0}
.ed-lines .in{height:34px}
.ed-lines .in.r{text-align:right;font-family:var(--mono)}
.ed-lines .c{display:block;font:500 10px var(--mono);color:var(--ink-3)}
.ed-add{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:baseline;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--rule-2);background:none;text-align:left}
.pick:hover b{color:var(--blue)}
.pick b{font:600 14.5px var(--sans)}

/* ---------- catalogue (tarif) ---------- */
.tarif{border-top:1px solid var(--ink)}
.tf-g{padding:24px 0 6px}
.tf-g h2{margin:0 0 6px;font:italic 400 22px var(--serif)}
.tf{display:grid;grid-template-columns:70px minmax(0,auto) minmax(30px,1fr) 70px 120px 90px;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.tf .c{font:500 11px var(--mono);color:var(--ink-3)}
.tf .d{font:500 15px/1.4 var(--sans)}
.tf .lead{border-bottom:1px dotted var(--ink-3);opacity:.6;transform:translateY(-4px)}
.tf .u{font-size:12.5px;color:var(--ink-3);text-align:right}
.tf .p{text-align:right;white-space:nowrap}
.tf .p input{width:84px;border:0;border-bottom:1px solid transparent;background:transparent;text-align:right;font:500 15px var(--mono);padding:2px 0}
.tf .p input:hover{border-bottom-color:var(--rule)}
.tf .p input:focus{outline:none;border-bottom-color:var(--blue)}
.tf .use{font-size:12px;color:var(--ink-3);text-align:right}

/* ---------- planning ---------- */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--rule-2)}
.wd{border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);min-height:470px;padding:12px 10px 18px;display:flex;flex-direction:column;gap:8px;cursor:copy;transition:background .15s}
.wd:hover{background:color-mix(in srgb,var(--wash) 60%,transparent)}
.wd.we{background:var(--wash)}
.wd-h{display:flex;align-items:baseline;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--rule-2);margin-bottom:4px}
.wd-h b{font:300 33px/1 var(--serif);letter-spacing:-.015em}
.wd-h span{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.wd-h em{margin-left:auto;font:normal 500 10.5px var(--mono);color:var(--ink-3)}
.wd.today .wd-h b{color:var(--blue)}
.wd.today .wd-h span{color:var(--blue)}
.ev{display:block;width:100%;text-align:left;border:0;background:var(--sheet);border-left:2px solid var(--blue);padding:8px 10px;box-shadow:0 1px 0 var(--rule-2);transition:transform .12s,box-shadow .12s;cursor:pointer}
.ev:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.ev time{display:block;font:500 11px var(--mono);color:var(--ink-3)}
.ev b{display:block;font:600 13.5px/1.35 var(--sans);margin:2px 0}
.ev small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.rdv{border-left-color:var(--ink)} .ev.admin{border-left-color:var(--amber)}
.wd .add{margin-top:auto;font-size:11.5px;color:var(--ink-3);opacity:0;transition:opacity .15s}
.wd:hover .add{opacity:1}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--ink);border-left:1px solid var(--rule-2)}
.mo-h{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
.mo-c{min-height:112px;padding:8px;border:0;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);background:none;text-align:left;display:flex;flex-direction:column;gap:3px}
.mo-c:hover{background:var(--wash)}
.mo-c.out{opacity:.4}
.mo-c b{font:400 20px/1 var(--serif);margin-bottom:4px}
.mo-c.td b{color:var(--blue)}
.mo-c span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px;border-left:2px solid var(--blue)}
.mo-c span.rdv{border-left-color:var(--ink)} .mo-c span.admin{border-left-color:var(--amber)}

/* ---------- trésorerie ---------- */
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;align-items:end;height:200px;border-bottom:1px solid var(--ink);padding-top:10px}
.bar-m{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:100%;position:relative}
.bar-m i{display:block;width:16px;background:var(--ink);transition:height .5s var(--ease)}
.bar-m i.o{background:transparent;border:1px solid var(--ink-3);border-bottom:0}
.bar-m.cur i{background:var(--blue)} .bar-m.cur i.o{background:transparent;border-color:var(--blue)}
.bar-l{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;text-align:center;font:500 11px var(--mono);color:var(--ink-3);padding-top:8px}
.rap{width:18px;height:18px;border:1px solid var(--rule);background:none;padding:0;display:grid;place-items:center;color:transparent}
.rap svg{width:12px;height:12px;stroke-width:2.2}
.rap.on{color:var(--green);border-color:var(--green)}

/* ---------- documents ---------- */
.fmt{display:inline-grid;place-items:center;width:38px;height:22px;border:1px solid var(--ink-3);font:500 9.5px var(--mono);letter-spacing:.06em;color:var(--ink-2)}
.fmt.PDF{border-color:var(--red);color:var(--red)} .fmt.JPG{border-color:var(--blue);color:var(--blue)} .fmt.DOCX,.fmt.XLSX{border-color:var(--green);color:var(--green)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0;border-top:1px solid var(--ink);border-left:1px solid var(--rule-2)}
.tpl{padding:20px 20px 22px;border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:8px}
.tpl .mini{height:120px;background:var(--doc);box-shadow:var(--shadow);margin-bottom:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.tpl .mini::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:#2B38D0}
.tpl .mini i{display:block;height:5px;background:var(--doc-rule)}
.tpl .mini i.h{width:40%;height:9px;background:#C9C8BF}
.tpl b{font:600 17px/1.3 var(--serif)}
.tpl p{margin:0;color:var(--ink-3);font-size:13px;flex:1}
.prev{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:26px}
.pv-page{background:var(--doc);min-height:360px;padding:30px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.pv-page i{display:block;height:7px;background:var(--doc-rule)}
.pv-page i.h{height:14px;width:46%;background:#C9C8BF}
.pv-page.photo{background:linear-gradient(155deg,#8E9AA6,#C8B79A 60%,#7E6C55)}

/* ---------- paramètres ---------- */
.set-s{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;padding:26px 0;border-bottom:1px solid var(--rule-2)}
.set-s:first-child{padding-top:0}
.set-s h3{margin:0 0 6px;font:600 19px/1.3 var(--serif)}
.set-s p{margin:0;color:var(--ink-3);font-size:13px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0;border-bottom:1px solid var(--rule-2)}
.trow:last-child{border-bottom:0}
.trow b{display:block;font-weight:500}
.trow small{color:var(--ink-3);font-size:12.5px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.th{border:1px solid var(--rule);background:none;padding:10px;text-align:left;border-radius:var(--r)}
.th.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.th .pv{height:84px;display:flex;flex-direction:column;padding:10px;gap:6px}
.th .pv b{font:400 22px/1 var(--serif)}
.th .pv i{display:block;height:2px}
.th span{display:block;margin-top:8px;font-weight:500;font-size:13px}
.num-big{font:400 30px var(--serif);color:var(--blue);letter-spacing:-.01em}

/* ---------- surcouches ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(500px,100vw);background:var(--paper);border-left:1px solid var(--ink);z-index:41;transform:translateX(102%);transition:transform .3s var(--ease);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sh-h{padding:26px 30px 18px;border-bottom:3px double var(--rule);display:flex;justify-content:space-between;gap:16px}
.sh-h h2{margin:6px 0 10px;font:400 26px/1.2 var(--serif);letter-spacing:-.01em}
.sh-b{flex:1;overflow:auto;padding:22px 30px;display:flex;flex-direction:column;gap:22px}
.sh-b>.line{flex:none}
.sheet.on~.leon-fab{opacity:0;pointer-events:none}
.leon-fab{transition:transform .2s var(--ease),background .2s,opacity .2s}
.sh-f{padding:16px 30px;border-top:1px solid var(--rule);display:flex;gap:10px;flex-wrap:wrap}
.amts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.amts div{padding:12px 14px 14px;border-left:1px solid var(--rule-2)}
.amts div:first-child{border-left:0;padding-left:0}
.amts b{display:block;font:400 22px/1.25 var(--serif);margin-top:6px;white-space:nowrap}
.payf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:18px;border:1px solid var(--ink)}
.payf .btn{grid-column:1/-1}
.modal-w{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:var(--scrim);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-w.on{opacity:1;pointer-events:auto}
.modal{width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--ink);box-shadow:var(--shadow);transform:translateY(8px);transition:transform .25s var(--ease)}
.modal.wide{width:min(820px,100%)}
.modal-w.on .modal{transform:none}
.modal>form{display:flex;flex-direction:column;min-height:0}
.mo-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 26px 14px;border-bottom:3px double var(--rule)}
.mo-hd h2{margin:0;font:400 24px/1.25 var(--serif);letter-spacing:-.008em}
.mo-bd{padding:22px 26px;overflow:auto}
.mo-ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 26px;border-top:1px solid var(--rule)}
.pal-w{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding-top:13vh;opacity:0;pointer-events:none;transition:opacity .15s}
.pal-w.on{opacity:1;pointer-events:auto}
.pal{width:min(660px,92vw);background:var(--paper);border:1px solid var(--ink);box-shadow:var(--shadow)}
.pal-in{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:3px double var(--rule)}

.pal-in input::placeholder{color:var(--ink-3);font-style:italic}
.pal-r{max-height:50vh;overflow:auto;padding:6px 10px 10px}
.pal-g{font:600 10.5px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px 4px}
.pal-i{display:flex;align-items:baseline;gap:12px;width:100%;padding:9px 12px;border:0;background:none;text-align:left}
.pal-i b{font:500 14.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-i small{margin-left:auto;font:500 11px var(--mono);color:var(--ink-3);white-space:nowrap}
.pal-i.sel{background:var(--blue-wash)}
.pal-i.sel b{color:var(--blue)}
.pal-f{display:flex;gap:18px;padding:10px 22px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.sommaire{position:fixed;inset:64px 0 0 0;background:var(--paper);z-index:35;overflow:auto;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .2s,transform .25s var(--ease)}
.sommaire.on{opacity:1;pointer-events:auto;transform:none}
.som-in{max-width:1100px;margin:0 auto;padding:40px 44px 80px}
.som-in h2{font:italic 300 50px/1.1 var(--serif);margin:0 0 24px;letter-spacing:-.015em}
.som-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:56px;border-top:1px solid var(--ink)}
.som-i{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:16px 0;border:0;border-bottom:1px solid var(--rule-2);background:none;text-align:left}
.som-i .n{font:300 30px/1 var(--serif);color:var(--ink-3)}
.som-i b{font:400 24px/1.15 var(--serif);letter-spacing:-.008em}
.som-i small{display:block;color:var(--ink-3);font-size:13px;margin-top:4px}
.som-i em{font:normal 500 11px var(--mono);color:var(--ink-3)}
.som-i:hover b,.som-i.on b{color:var(--blue)}
.pop{position:fixed;top:60px;right:20px;width:310px;background:var(--paper);border:1px solid var(--ink);box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transform:translateY(-6px);transition:.18s var(--ease)}
.pop.on{opacity:1;pointer-events:auto;transform:none}
.pop-h{padding:18px 20px 14px;border-bottom:3px double var(--rule)}
.pop-h b{display:block;font:600 19px var(--serif)}
.pop-h span{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.pop-b{padding:12px 20px}
.pop-l{display:flex;flex-direction:column;padding:6px 10px 12px}
.pop-l button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;text-align:left;color:var(--ink-2)}
.pop-l button:hover{background:var(--wash);color:var(--ink)}
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--on-ink);padding:11px 12px 11px 16px;border-left:4px solid var(--blue);font-size:13.5px;box-shadow:var(--shadow);animation:tin .28s var(--ease);transition:opacity .25s,transform .25s;max-width:min(600px,92vw)}
.toast.err{border-left-color:var(--red)}
.toast button{border:0;background:none;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0 4px}
.toast.out{opacity:0;transform:translateY(6px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ---------- Léon ---------- */
.leon-fab{position:fixed;right:28px;bottom:26px;z-index:55;display:flex;align-items:center;gap:12px;height:52px;padding:0 20px 0 6px;border:1px solid var(--ink);border-radius:26px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);transition:transform .2s var(--ease),background .2s}
.leon-fab:hover{transform:translateY(-2px)}
.leon-fab .lm{width:40px;height:40px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font:italic 500 21px/1 var(--serif);position:relative}
.leon-fab .lm::after{content:"";position:absolute;right:1px;top:1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--paper)}
.leon-fab span{font:600 16px var(--serif)}
.leon-fab small{display:block;font:500 10px var(--mono);color:var(--ink-3);letter-spacing:.06em;margin-top:1px}
.leon-fab.on{background:var(--ink);color:var(--on-ink)}
.leon-fab.on small{color:var(--on-ink);opacity:.6}

.leon.on{opacity:1;pointer-events:auto;transform:none}
.le-h{padding:18px 20px 14px;border-bottom:3px double var(--rule);display:flex;gap:12px;align-items:flex-start}
.le-h .lm{width:38px;height:38px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font:italic 500 21px/1 var(--serif);flex:none}
.le-h.think .lm{animation:breath 1.2s ease-in-out infinite}

.le-h b{font:600 21px/1.15 var(--serif)}
.le-h p{margin:3px 0 0;font:italic 13px var(--serif);color:var(--ink-3)}
.le-h .sp{flex:1}

.le-ctx b{color:var(--blue);font-weight:500}
.le-m{flex:1;min-height:0;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.m{flex:none;font-size:14px;line-height:1.55;max-width:94%}
.m.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);padding:9px 13px;border-radius:14px 14px 3px 14px}

.m.l .draft{white-space:pre-wrap;font:13px/1.55 var(--sans);background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;margin-top:10px}
.typing{display:flex;gap:5px;padding:6px 0 6px 14px;border-left:2px solid var(--blue)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}
.le-s{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px}
.sg{border:1px solid var(--rule);background:none;padding:5px 11px;border-radius:14px;font-size:12.5px;color:var(--ink-2);text-align:left}
.sg:hover{border-color:var(--blue);color:var(--blue)}
.le-f{display:flex;gap:10px;align-items:center;padding:12px 20px 14px;border-top:1px solid var(--rule)}
.le-f .in{height:40px;font-size:14px}
.le-f .btn{width:40px;padding:0;border-radius:50%}

function go(ch,tab,id=null,mode=null){
  if(!CH[ch])return;
  const tabs=CH[ch].tabs;
  S.ch=ch;S.tab=tab&&tabs.some(t=>t[0]===tab)?tab:(tabs[0]||[null])[0];S.id=id;S.mode=mode;
  closeSheet();closeSom();closePop();
  render(true);
}
function render(reset){renderTop();renderMain(reset);if(S.leon)renderLeonCtx()}
function renderMain(reset){
  const sc=$('#scroll'),y=sc.scrollTop;
  if(S.ch==='accueil') sc.innerHTML=`<div class="home ${reset?'view-in':''}">${vHome()}</div>`;
  else{const v=VIEW();sc.innerHTML=`<div class="layout ${reset?'view-in':''}"><aside class="margin">${v.m}</aside><section class="body">${v.b}</section></div>`}
  sc.scrollTop=reset?0:y;
}
function renderTop(){
  const dark=document.documentElement.dataset.theme==='dark',lt=late().length;
  const nv=id=>`<button class="nv ${S.ch===id?'on':''}" data-act="go" data-ch="${id}" title="${CH[id].name} · Alt+${+CH[id].n}"><sup>${CH[id].n}</sup><span>${CH[id].name}</span>${id==='facturation'&&lt?'<i class="dot" title="Factures en retard"></i>':''}</button>`;
  $('#top').innerHTML=`<button class="ib sommaire-btn" data-act="som" title="Sommaire">${ic('menu')}</button>
  <button class="brand" data-act="som" title="Ouvrir le sommaire"><span class="mark">B</span><span class="bt"><b>Batorya</b><span>Essentiel · V6</span></span></button>
  <nav class="nav" aria-label="Chapitres">${ORDER.slice(0,9).map(nv).join('')}<i class="nv-sep"></i>${nv('parametres')}</nav>
  <div class="tools">
    <button class="find" data-act="palette" title="Chercher (Ctrl K)">${ic('search')}<span>Chercher…</span><kbd>Ctrl K</kbd></button>
    <button class="ib" data-act="theme-toggle" title="Thème ${dark?'clair':'sombre'}">${ic(dark?'sun':'moon')}</button>
    <button class="who" data-act="pop" title="Profil de l’entreprise">HD</button>
  </div>`;
}
function VIEW(){
  switch(S.ch){
    case 'crm':return S.id?vClient(S.id):S.tab==='echanges'?vEchanges():vClients();
    case 'commerce':return S.mode==='edit'?vEditor():S.id?vDevis(S.id):S.tab==='commandes'?vCommandes():vDevisList();
    case 'travaux':return S.id?vChantier(S.id):S.tab==='journal'?vJournal():vChantiers();
    case 'facturation':return S.tab==='relances'?vRelances():vFactures();
    case 'tresorerie':return S.tab==='livre'?vLivre():S.tab==='echeancier'?vEcheancier():vTreso();
    case 'catalogue':return vCatalogue();
    case 'documents':return S.tab==='modeles'?vModeles():vClasseur();
    case 'planification':return S.tab==='mois'?vMois():vSemaine();
    case 'parametres':return vParams();
  }
  return {m:'',b:''};
}
function tabCount(k){
  const m={clients:DB.clients.length,devis:DB.devis.length,chantiers:DB.chantiers.filter(c=>chSt(c)!=='Terminé').length,factures:DB.factures.length,relances:late().length||'',classeur:DB.docs.length,prestations:CAT.length,fournitures:FOURN.length,echanges:DB.act.length};
  return m[k]??'';
}
function margin(extra='',acts=''){

  ${acts?`<div class="m-acts">${acts}</div>`:''}${extra}`;
}
function marginDetail(backTab,backLabel,extra){

  <h1 class="headline">${headline}</h1>
  <p class="lede">${lede}</p>
  <div class="sec-h"><h2>Octobre, d’un coup d’œil</h2><div class="fr-legend"><span><i style="background:var(--blue)"></i>Chantier réalisé</span><span><i style="border:1px dashed var(--blue)"></i>À venir</span><span><i style="background:var(--red);transform:rotate(45deg)"></i>Échéance en retard</span><span><i style="background:var(--blue);transform:rotate(45deg)"></i>Échéance</span><span><i style="background:var(--ink);border-radius:50%"></i>Rendez-vous</span></div></div>
  ${frise()}

    <div class="col"><div class="col-h"><h3>À relancer</h3><em>${lt.length+wait.filter(d=>dd(TODAY,d.date)>=10).length}</em></div>${relancer()}</div>
    <div class="col"><div class="col-h"><h3>Sur les chantiers</h3><em>${DB.chantiers.filter(c=>chSt(c)!=='Terminé').length}</em></div>${DB.chantiers.filter(c=>chSt(c)!=='Terminé').sort((a,b)=>a.debut.localeCompare(b.debut)).map(c=>{const p=chProg(c);return `<button class="ch-e" data-act="open-ch" data-id="${c.id}"><div class="e-t">${esc(c.objet)}</div><div class="e-s">${esc(cli(c.client).nom)} · ${chSt(c)==='Planifié'?`démarre ${fDl(c.debut)}`:`fin prévue le ${fDs(c.fin)}`}</div><div class="row">${line(p,chSt(c)==='Planifié'?'':'blue')}<span class="pc">${p}<small class="mut" style="font-size:13px"> %</small></span></div></button>`}).join('')}</div>
    <div class="col"><div class="col-h"><h3>Prochains rendez-vous</h3><em>${weekRange(TODAY)}</em></div>${DB.events.filter(e=>e.date>=TODAY&&e.date<=addD(TODAY,6)&&e.type!=='chantier').sort(byDT).map(agItem).join('')||empty('Aucun rendez-vous cette semaine.')}<div style="margin-top:14px"><button class="go-arrow" data-act="go" data-ch="planification">Toute la semaine ${ic('arrow')}</button></div></div>
  </div>
  <div class="ledger2">
    <div><div class="sec-h"><h2>Le mois en chiffres</h2><span class="caps">Octobre · au 12</span></div>
      ${ld('Encaissé',eur(inMonth('2026-10','in')))}${ld('Dépensé',eur(inMonth('2026-10','out')))}${ld('Facturé',eur(sum(DB.factures.filter(f=>!f.brouillon&&f.date.startsWith('2026-10')),f=>f.m)))}${ld('Devis signés',`${DB.devis.filter(d=>d.hist.some(h=>h[1].startsWith('Bon')&&h[0].startsWith('2026-10'))).length} · ${eur0(sum(DB.devis.filter(d=>d.hist.some(h=>h[1].startsWith('Bon')&&h[0].startsWith('2026-10'))),d=>tot(d.lines)))}`)}${ld('Solde du compte professionnel',eur(solde()),'big')}
    </div>

      <div class="gauge"><div class="tr"></div><div class="fi ${pct>85?'warn':''}" style="width:${Math.min(100,pct)}%"></div><div class="tk"></div><div class="lim" style="left:100%"><span>${eur0(SEUIL)}</span></div></div>

function weekRange(s){const m=monday(s);return `${P(m).getDate()}–${P(addD(m,6)).getDate()} oct.`}
function agItem(e){return `<div class="ag" data-act="open-ev" data-id="${e.id}"><div class="d"><span>${wdS(e.date)}</span><b>${P(e.date).getDate()}</b></div><div><div class="e-t">${esc(e.t)}</div><div class="e-s"><span class="mono">${e.s}</span> · ${esc(refName(e.ref)||TYPE_L[e.type])}</div></div></div>`}
function relancer(){
  const lt=late(),wait=DB.devis.filter(d=>dSt(d)==='Envoyé'&&dd(TODAY,d.date)>=10).sort((a,b)=>a.date.localeCompare(b.date));
  const items=[...lt.map(f=>`<div class="entry ${S.done.has(f.id)?'mut':''}"><span class="e-t">${esc(cli(f.client).nom)}</span><span class="num t-red">${eur(fReste(f))}</span><span class="e-s">Facture ${f.id} · échue ${rel(f.ech)}${f.rel.length?` · ${f.rel.length} relance`:''}</span><span class="e-a"><button class="lk" data-act="leon-relance" data-id="${f.id}">Rédiger la relance</button><button class="lk" data-act="open-fac" data-id="${f.id}">Ouvrir</button></span></div>`),
   ...wait.map(d=>`<div class="entry"><span class="e-t">${esc(cli(d.client).nom)}</span><span class="num">${eur0(tot(d.lines))}</span><span class="e-s">Devis ${d.id} · envoyé il y a ${dd(TODAY,d.date)} jours</span><span class="e-a"><button class="lk" data-act="devis-relance" data-id="${d.id}">Relancer</button><button class="lk" data-act="open-devis" data-id="${d.id}">Ouvrir</button></span></div>`)];
  return items.join('')||empty('Personne à relancer. Belle semaine.');
}
function frise(){
  const days=[...Array(31)].map((_,i)=>`2026-10-${String(i+1).padStart(2,'0')}`);
  const col=s=>P(s).getDate()+1;
  const cols=`<div class="fr-cols">${days.map(d=>`<i class="${[0,6].includes(P(d).getDay())?'we':''}"></i>`).join('')}</div>`;
  const head=`<div class="fr-row fr-head"><span></span>${days.map(d=>`<span class="d ${d===TODAY?'td':''}">${P(d).getDate()}</span>`).join('')}</div>`;
  const chs=DB.chantiers.filter(c=>c.fin>='2026-10-01'&&c.debut<='2026-10-31').sort((a,b)=>a.debut.localeCompare(b.debut));
  const rows=chs.map(c=>{const s=c.debut<'2026-10-01'?'2026-10-01':c.debut,e=c.fin>'2026-10-31'?'2026-10-31':c.fin,p=chProg(c),stt=chSt(c);
    return `<div class="fr-row"><span class="fr-lab"><b>${esc(cli(c.client).nom)}</b></span><button class="fr-bar ${stt==='Terminé'?'done':stt==='Planifié'?'plan':''}" style="grid-column:${col(s)}/${col(e)+1}" data-act="open-ch" data-id="${c.id}" title="${esc(c.objet)} — ${p} %"><i style="width:${stt==='Planifié'?0:p}%"></i><span>${p} %</span></button></div>`}).join('');
  const fx=DB.factures.filter(f=>!f.brouillon&&f.ech&&f.ech.startsWith('2026-10'));
  const k=f=>{const s=fSt(f);return s==='En retard'?'bad':s==='Réglée'?'ok':s==='Partielle'?'wait':'info'};
  const ech=`<div class="fr-row"><span class="fr-lab">Échéances</span>${fx.map(f=>`<button class="fr-mk ${k(f)}" style="grid-column:${col(f.ech)}" data-act="open-fac" data-id="${f.id}" title="${f.id} — ${esc(cli(f.client).nom)} — ${eur(fReste(f)||f.m)} · ${fSt(f)}"></button>`).join('')}<button class="fr-mk hollow" style="grid-column:${col('2026-10-31')}" data-act="go" data-ch="tresorerie" title="Déclaration URSSAF du trimestre — 31 octobre"></button></div>`;
  const rdv=DB.events.filter(e=>e.type==='rdv'&&e.date.startsWith('2026-10'));
  const byDay={};rdv.forEach(e=>{byDay[e.date]=byDay[e.date]||e});
  const rd=`<div class="fr-row"><span class="fr-lab">Rendez-vous</span>${Object.values(byDay).map(e=>`<button class="fr-dot" style="grid-column:${col(e.date)}" data-act="open-ev" data-id="${e.id}" title="${fDs(e.date)} · ${e.s} — ${esc(e.t)}"></button>`).join('')}</div>`;
  const left=`calc(var(--lab) + (100% - var(--lab)) * ${(P(TODAY).getDate()-.5)/31})`;
  return `<div class="frise">${cols}${head}${rows}${ech}${rd}<div class="fr-today" style="left:${left}"><span>Auj.</span></div></div>`;
}

function clientRows(){
  const q=norm(S.q.clients),t=fv('ctype','tous');
  const rows=DB.clients.filter(c=>(t==='tous'||(t==='Prospect'?c.statut==='Prospect':c.type===t))&&(!q||norm([c.nom,c.ville,c.contact,c.tel,c.mail].join(' ')).includes(q))).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  if(!rows.length)return `<tr><td colspan="6">${empty('Aucun client ne correspond.')}</td></tr>`;
  return rows.map(c=>{const fx=DB.factures.filter(f=>f.client===c.id&&!f.brouillon),ca=sum(fx,f=>f.m),du=sum(fx,fReste);
    const last=[...DB.act.filter(a=>a.client===c.id).map(a=>a.date),...DB.devis.filter(d=>d.client===c.id).map(d=>d.date)].sort().pop();

function field(x){

function leonRelance(id){closeSheet();leonToggle(true);leonAsk(`Rédige une relance pour la facture ${id}`)}
const lb=(l,act,id,x='')=>`<button class="btn sm quiet" data-act="${act}" data-id="${id||''}" ${x}>${l}</button>`;
function draft(key,txt,extra=''){LE.drafts[key]=txt;return `<div class="draft">${esc(txt)}</div><div class="acts"><button class="btn sm" data-act="copy-draft" data-id="${key}">${ic('copy')}<span>Copier</span></button>${extra}</div>`}
function relanceTxt(f){const c=cli(f.client),second=f.rel.length>0;
return `Objet : Facture ${f.id} — ${second?'relance':'rappel'} de règlement

Bonjour ${c.sal},

${second?'Malgré notre précédent rappel, la facture':'Sauf erreur de ma part, la facture'} ${f.id} du ${fD(f.date)}, d’un montant restant dû de ${eur(fReste(f))}, est arrivée à échéance le ${fD(f.ech)}.

Pourriez-vous procéder au règlement dans les meilleurs délais ? S’il a déjà été effectué, merci de ne pas tenir compte de ce message.${isPro(f.client)?`

Pour rappel, tout retard de paiement entre professionnels entraîne les pénalités prévues à nos conditions générales ainsi qu’une indemnité forfaitaire de 40 € pour frais de recouvrement.`:''}

Bien cordialement,
${CO.dir}
${CO.nom} — ${CO.tel}`}
function answer(q){
  const s=norm(q),fm=q.match(/F-\d{4}-\d{3}/i),dm=q.match(/D-\d{4}-\d{3}/i),lt=late();
  if(/relan|rappel/.test(s)&&(fm||/factur|ancien|retard/.test(s))){
    const f=fm?fac(fm[0].toUpperCase()):lt[0];
    if(!f)return 'Aucune facture n’est en retard : rien à relancer.';
    if(fReste(f)<=0)return `La facture <b>${f.id}</b> est déjà réglée.`;
    return `Voici un ${f.rel.length?'deuxième message':'premier rappel'} pour <b>${esc(cli(f.client).nom)}</b>, ${f.ech<TODAY?`en retard de ${dd(TODAY,f.ech)} jours`:'pas encore échue'}.`+draft('r-'+f.id,relanceTxt(f),lb('Marquer comme relancée','mark-relance',f.id)+lb('Ouvrir la facture','open-fac',f.id));
  }
  if(/retard|impaye|doivent|dette/.test(s)){
    if(/client/.test(s)){const r=DB.clients.map(c=>({c,du:sum(DB.factures.filter(f=>f.client===c.id&&!f.brouillon),fReste)})).filter(x=>x.du>0).sort((a,b)=>b.du-a.du);
      return `${r.length} clients ont un solde à régler :<div class="ldl">${r.map(x=>ld(esc(x.c.nom),eur(x.du))).join('')}</div>`}
    if(!lt.length)return 'Aucune facture en retard. Tout ce qui est échu est réglé.';
    return `<b>${lt.length} factures</b> sont en retard, pour <b>${eur(sum(lt,fReste))}</b> :<div class="ldl">${lt.map(f=>ld(`${f.id} · ${esc(cli(f.client).nom)} · ${dd(TODAY,f.ech)} j`,eur(fReste(f)))).join('')}</div><div class="acts">${lt.map(f=>`<button class="btn sm quiet" data-act="leon-ask" data-q="Rédige une relance pour la facture ${f.id}">Relancer ${f.id}</button>`).join('')}</div>`;
  }
  if(/presse|urgent|priorit|aujourd|commence/.test(s)){
    const td=DB.events.filter(e=>e.date===TODAY).sort(byDT),w=DB.devis.filter(d=>dSt(d)==='Envoyé'&&dd(TODAY,d.date)>=10);
    return `Aujourd’hui, vous êtes chez <b>${esc(refName(td[0]?.ref))}</b> pour ${esc((td[0]?.t||'').toLowerCase())}, jusqu’à ${td.length?td[td.length-1].e.replace(':',' h '):''}. Ensuite, par ordre d’importance :<div class="ldl">${lt.map(f=>ld(`Relancer ${esc(cli(f.client).nom)}`,eur(fReste(f)))).join('')}${w.slice(0,2).map(d=>ld(`Relancer le devis ${d.id}`,`${dd(TODAY,d.date)} j`)).join('')}${ld('Préparer la déclaration URSSAF','31 oct.')}${ld('Émettre le solde Vandamme (brouillon)','après réception')}</div>`;
  }
  if(/seuil|franchise|plafond/.test(s)){const ca=caAnnee(),p=ca/SEUIL*100;
    return `Vous avez encaissé <b>${eur0(ca)}</b> depuis janvier, soit <b>${Math.round(p)} %</b> du seuil suivi (${eur0(SEUIL)}). Il reste ${eur0(SEUIL-ca)} de marge.<br><br>${p>85?'Au rythme actuel, le seuil pourrait être atteint avant la fin de l’année : vérifiez votre situation avec votre comptable ou les services fiscaux.':'Le rythme actuel laisse une marge confortable.'}<p class="note" style="font-family:var(--sans)">Seuil de démonstration, à confirmer pour votre activité.</p>`}
  if(/urssaf|cotis|declar|cote/.test(s)){const u=urssaf();
    return `Pour le 3e trimestre, vos recettes encaissées s’élèvent à <b>${eur(u.ca)}</b>.<div class="ldl">${ld('Cotisations sociales',eur(u.cot))}${ld('Formation professionnelle',eur(u.cfp))}${ld('À mettre de côté',eur(u.tot),'big')}</div>Déclaration avant le 31 octobre. J’ai noté un créneau administratif le 29.<p class="note" style="font-family:var(--sans)">Estimation sur des taux de démonstration.</p>`}
  if(/treso|solde|compte|argent/.test(s)){const due=DB.factures.filter(f=>!f.brouillon&&fReste(f)>0);
    return `Le compte professionnel affiche <b>${eur(solde())}</b>. Il reste <b>${eur(sum(due,fReste))}</b> à encaisser sur ${due.length} factures, dont ${eur(sum(lt,fReste))} en retard. Fin octobre, prévoyez environ ${eur0(urssaf().tot)} de cotisations.<div class="acts">${lb('Voir l’échéancier','go','','data-ch="tresorerie" data-tab="echeancier"')}</div>`}
  if(/creneau|dispo|libre/.test(s)){const out=[];
    for(let i=0;i<12&&out.length<3;i++){const d=addD(TODAY,i),w=P(d).getDay();if(!w||w===6)continue;let t=8,found=null;for(const e of DB.events.filter(e=>e.date===d).sort(byDT)){if(hm(e.s)-t>=2){found=t;break}t=Math.max(t,hm(e.e))}if(found==null&&17-t>=2)found=t;if(found!=null)out.push([d,found])}
    const hh=x=>`${String(Math.floor(x)).padStart(2,'0')}:${x%1?'30':'00'}`;
    return `Premiers créneaux de deux heures entre 8 h et 17 h :<div class="ldl">${out.map(([d,t])=>`<div class="ld"><span>${cap(fDl(d))}</span><i></i><b>${hh(t)}</b> <button class="lk" data-act="new-ev" data-date="${d}" data-time="${hh(t)}" style="margin-left:8px;font-size:12.5px">Planifier</button></div>`).join('')}</div>`}
  if(/planning|semaine|agenda/.test(s)){const ws=monday(TODAY),e=DB.events.filter(x=>x.date>=ws&&x.date<=addD(ws,6)).sort(byDT);
    return `Semaine du ${weekRange(TODAY)} — ${e.length} interventions :<div class="ldl">${e.map(x=>ld(`${cap(wdS(x.date))} ${x.s} · ${esc(x.t)}`,esc(refName(x.ref)||TYPE_L[x.type]))).join('')}</div>Jeudi est long : portes chez Mme Haddad, puis rendez-vous à la crèche à 17 h 30.`}
  if(/devis/.test(s)&&/mail|envoi|redig|accompagn/.test(s)){const d=dm?dev(dm[0].toUpperCase()):(S.ch==='commerce'&&S.id&&dev(S.id));
    if(!d)return 'Donnez-moi le numéro du devis, par exemple D-2026-044.';
    const c=cli(d.client);
    const txt=`Objet : Votre devis ${d.id} — ${d.objet}

Bonjour ${c.sal},

Suite à notre rendez-vous, vous trouverez ci-joint mon devis ${d.id} pour ${d.objet.charAt(0).toLowerCase()+d.objet.slice(1)}, d’un montant de ${eur(tot(d.lines))} (${MENTION}).

Il est valable jusqu’au ${fD(addD(d.date,d.valid))}. Pour l’accepter, il suffit de me le retourner signé avec la mention « Bon pour accord », accompagné d’un acompte de 30 %.

Je reste disponible pour ajuster un poste ou en parler de vive voix.

Bien cordialement,
${CO.dir}
${CO.nom} — ${CO.tel}`;
    return `Proposition de message pour <b>${esc(c.nom)}</b> :`+draft('d-'+d.id,txt,d.statut==='Brouillon'?lb('Marquer comme envoyé','devis-send',d.id):'')}
  if(/devis|signature|attente|reponse/.test(s)){const w=DB.devis.filter(d=>dSt(d)==='Envoyé').sort((a,b)=>a.date.localeCompare(b.date)),dec=DB.devis.filter(d=>['Signé','Refusé','Expiré'].includes(dSt(d)));
    return `<b>${w.length} devis</b> attendent une réponse, pour ${eur0(sum(w,d=>tot(d.lines)))}. Taux de signature : <b>${dec.length?Math.round(100*dec.filter(d=>d.statut==='Signé').length/dec.length):0} %</b>.<div class="ldl">${w.map(d=>ld(`${d.id} · ${esc(cli(d.client).nom)}`,`${dd(TODAY,d.date)} j`)).join('')}</div>Le gîte ne décidera qu’après la saison : un appel à Mme Dufresne samedi serait plus utile qu’un e-mail.`}
  if(/chantier|avancement|rentab|point/.test(s)){
    if(S.ch==='travaux'&&S.id&&/ce chantier/.test(s)){const c=chn(S.id),nx=c.phases.find(x=>!x[1]),b=chBud(c),d=chDep(c);
      return `<b>${esc(c.objet)}</b> est avancé à <b>${chProg(c)} %</b>. ${nx?`Prochaine étape : ${esc(nx[0].toLowerCase())}.`:'Toutes les phases sont terminées.'} Achats engagés : ${eur(d)} pour ${eur(b)} vendus, soit une marge brute de <b>${b?Math.round((b-d)/b*100):0} %</b>. Fin prévue ${fDl(c.fin)}.`}
    const a=DB.chantiers.filter(c=>chSt(c)!=='Terminé'),best=[...DB.chantiers].map(c=>({c,m:chBud(c)?(chBud(c)-chDep(c))/chBud(c):0})).sort((x,y)=>y.m-x.m);
    return `${a.length} chantiers ouverts :<div class="ldl">${a.map(c=>ld(esc(c.objet),`${chProg(c)} %`)).join('')}</div>Meilleure marge brute : <b>${esc(best[0].c.objet)}</b> (${Math.round(best[0].m*100)} %). La réception du dressing est prévue vendredi à 14 h.`}
  if(/resume|fiche/.test(s)&&S.ch==='crm'&&S.id){const c=cli(S.id),fx=DB.factures.filter(f=>f.client===c.id&&!f.brouillon);
    return `<b>${esc(c.nom)}</b>, ${c.type.toLowerCase()} à ${esc(c.ville)}, client depuis ${P(c.depuis).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}. ${eur0(sum(fx,f=>f.m))} facturés, ${sum(fx,fReste)?`${eur(sum(fx,fReste))} restant dus`:'aucun impayé'}.<br>À retenir : ${esc(c.notes)}`}
  if(/meilleur/.test(s)){const r=DB.clients.map(c=>({c,ca:sum(DB.factures.filter(f=>f.client===c.id&&!f.brouillon),f=>f.m)})).filter(x=>x.ca).sort((a,b)=>b.ca-a.ca);
    return `Par montant facturé :<div class="ldl">${r.slice(0,5).map(x=>ld(esc(x.c.nom),eur0(x.ca))).join('')}</div>Douaisis Immobilier peut devenir récurrent : le devis D-2026-042 mérite un appel.`}
  if(/document|expir|attestation/.test(s)){const w=DB.docs.filter(x=>x.exp).sort((a,b)=>a.exp.localeCompare(b.exp));
    return `Documents à échéance :<div class="ldl">${w.map(x=>ld(esc(x.nom),fDs(x.exp))).join('')}</div>Demandez dès maintenant l’attestation décennale 2027 : la SCI la réclamera pour les prochains travaux.`}
  if(/prestation|vends|tarif/.test(s)){const r=CAT.map(x=>({x,n:sum(DB.devis,d=>sum(d.lines.filter(l=>l.code===x.code),l=>l.q*l.pu))})).filter(o=>o.n).sort((a,b)=>b.n-a.n);
    return `Prestations les plus chiffrées dans vos devis :<div class="ldl">${r.slice(0,5).map(o=>ld(esc(o.x.des),eur0(o.n))).join('')}</div>`}
  if(/fourniture|marge/.test(s)){const r=FOURN.map(x=>({x,k:x.pu/x.pa})).sort((a,b)=>a.k-b.k);
    return `Coefficients les plus faibles :<div class="ldl">${r.slice(0,4).map(o=>ld(esc(o.x.des),'× '+o.k.toFixed(2).replace('.',','))).join('')}</div>`}
  return `Je peux notamment :<div class="ldl">${['Faire le point du jour','Lister les retards et rédiger les relances','Préparer le mail d’envoi d’un devis','Résumer la trésorerie et l’URSSAF','Surveiller le seuil de franchise','Trouver un créneau libre'].map(x=>`<div class="ld"><span>${x}</span></div>`).join('')}</div>Essayez une des suggestions ci-dessous.`;
}
