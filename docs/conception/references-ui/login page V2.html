<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATORYA Essentiel V6 — Plan Technique</title>
<style>
  :root {
    --orange: #dc6e29;
    --blue-soft: #5B86AE;
    --blue-deep: #2E5D8C;
    --orange-soft2: #C9823A;
    --text: #1B1C1E;
    --text-sec: #595C61;
    --bg: #E9EEF4;
    --bg-deep: #DCE5EF;
    --orange-soft: rgba(201, 130, 58, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(circle at 18% 18%, rgba(53,105,158,0.16), transparent 32%),
      radial-gradient(circle at 82% 78%, rgba(201,130,58,0.13), transparent 30%),
      linear-gradient(135deg, var(--bg) 0%, #F4F6F9 48%, var(--bg-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ===== TECHNICAL PLAN ===== */
  .plan-stage {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .plan-svg { width: 100%; height: 100%; }

  .plan-stage::after {
    content: '';
    position: absolute;
    width: 520px;
    height: 520px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(53,105,158,0.08), rgba(201,130,58,0.035) 38%, transparent 72%);
    filter: blur(8px);
    animation: ambientPulse 9s ease-in-out infinite;
  }

  @keyframes ambientPulse {
    0%, 100% { opacity: .65; transform: translate(-50%, -50%) scale(.96); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
  }

  .draw {
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation: drawLine 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  .draw-delay-1 { animation-delay: 0.35s; }
  .draw-delay-2 { animation-delay: 0.7s; }
  .draw-delay-3 { animation-delay: 1.05s; }
  .draw-delay-4 { animation-delay: 1.4s; }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .fade-in {
    opacity: 0;
    animation: fadeIn 1.2s ease forwards;
  }
  .fade-delay-1 { animation-delay: 1.1s; }
  .fade-delay-2 { animation-delay: 1.6s; }
  .fade-delay-3 { animation-delay: 2.0s; }

  .technical-pulse {
    animation: technicalPulse 5s ease-in-out 3s infinite;
  }

  @keyframes technicalPulse {
    0%, 100% { opacity: .18; }
    50% { opacity: .42; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ===== PANEL ===== */
  .panel-wrapper {
    position: relative;
    z-index: 10;
    animation: panelEnter 1.1s cubic-bezier(0.22, 1, 0.36, 1) 2.1s both;
  }

  @keyframes panelEnter {
    from {
      opacity: 0;
      transform: translateY(32px) scale(0.96);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .login-panel {
    width: min(420px, 92vw);
    background: linear-gradient(145deg, rgba(255,255,255,.82), rgba(248,250,252,.68));
    backdrop-filter: blur(22px) saturate(1.35);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.78);
    box-shadow:
      0 4px 10px -2px var(--blue-soft),
      0 14px 32px -8px var(--blue-soft),
      0 28px 60px -16px var(--blue-soft), 
      0 0 0 1px rgba(53, 105, 158, 0.04),
      inset 0 -1px 0 rgba(53,105,158,0.04);
    padding: 40px 36px 36px;
    position: relative;
    overflow: hidden;
    transition:
      width 950ms cubic-bezier(0.22, 1, 0.36, 1),
      padding-left 950ms cubic-bezier(0.22, 1, 0.36, 1),
      padding-right 950ms cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 950ms ease,
      border-radius 950ms ease;
  }

  .login-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 30px;
    right: 30px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(53,105,158,.2), rgba(201,130,58,.65), rgba(53,105,158,.2), transparent);
  }

  .logo {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
    position: relative;
  }

  .logo img {
    height: 44px;
    width: auto;
    filter: drop-shadow(0 3px 8px rgba(53,105,158,.16));
  }

  /* Mode switch */
  .mode-switch {
    display: flex;
    background: linear-gradient(90deg, rgba(53,105,158,.08), rgba(201,130,58,.09));
    border: 1px solid rgba(53,105,158,.08);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
    gap: 4px;
  }

  .mode-btn {
    flex: 1;
    height: 38px;
    border: none;
    border-radius: 9px;
    background: transparent;
    font-size: 13.5px;
    font-weight: 550;
    color: var(--text-sec);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .mode-btn.active {
    background: white;
    color: var(--orange);
    box-shadow: 0 3px 10px rgba(31,45,61,.08), inset 0 0 0 1px rgba(53,105,158,.06);
  }

  .mode-btn:hover:not(.active) {
    color: var(--text);
  }

  .welcome {
    text-align: center;
    margin-bottom: 28px;
  }

  .welcome h1 {
    font-size: 24px;
    font-weight: 650;
    color: var(--orange);
    letter-spacing: -0.035em;
    margin-bottom: 8px;
    position: relative;
  }

  .welcome h1::after {
    content: '';
    display: block;
    width: 42px;
    height: 2px;
    margin: 10px auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--orange), var(--orange-soft2));
    opacity: .75;
  }

  .welcome p {
    font-size: 14.5px;
    color: var(--text-sec);
  }

  .workspace-form {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
    transition:
      grid-template-columns 950ms cubic-bezier(0.22, 1, 0.36, 1),
      column-gap 950ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .workspace-section {
    min-width: 0;
  }

  .workspace-section--security {
    padding-top: 0;
  }

  .section-heading {
    display: block;
    opacity: 0;
    transform: translateY(-8px);
    overflow: hidden;
    transition:
      max-height 700ms ease,
      margin-bottom 700ms ease,
      opacity 500ms ease,
      transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-sec);
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 550;
    color: var(--text-sec);
    margin-bottom: 7px;
  }

  .form-group input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid rgba(89, 92, 97, 0.18);
    background: rgba(255, 255, 255, 0.7);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: all 0.22s ease;
  }

  .form-group input:hover {
    border-color: rgba(53, 105, 158, 0.45);
    background: rgba(255, 255, 255, 0.85);
  }

  .form-group input:focus {
    border-color: rgba(53, 105, 158, 0.55);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(53, 105, 158, 0.12);
  }

  .form-group input::placeholder {
    color: #a0a4ab;
  }

  .avatar-field {
    display: block;
    max-height: 0;
    margin: 0;
    opacity: 0;
    transform: translateY(-12px);
    overflow: hidden;
    pointer-events: none;
    transition:
      max-height 800ms ease,
      margin 800ms ease,
      opacity 550ms ease,
      transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
    text-align: center;
  }

  .avatar-button {
    width: 104px;
    height: 104px;
    margin: 0 auto 10px;
    padding: 0;
    border: 1px solid rgba(53,105,158,.20);
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, rgba(255,255,255,.95), rgba(236,241,246,.82));
    color: var(--blue-deep);
    display: grid;
    place-items: center;
    cursor: pointer;
    overflow: hidden;
    box-shadow:
      0 8px 20px rgba(53,105,158,.10),
      inset 0 0 0 5px rgba(255,255,255,.45);
    transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
  }

  .avatar-button:hover {
    transform: translateY(-1px);
    border-color: rgba(201,130,58,.55);
    box-shadow:
      0 10px 24px rgba(53,105,158,.12),
      0 0 0 4px rgba(201,130,58,.08),
      inset 0 0 0 5px rgba(255,255,255,.45);
  }

  .avatar-placeholder {
    display: grid;
    gap: 4px;
    place-items: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-sec);
  }

  .avatar-placeholder svg {
    width: 22px;
    height: 22px;
    opacity: .72;
  }

  .avatar-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .avatar-caption {
    font-size: 12px;
    color: var(--text-sec);
  }

  .remember-me {
    max-height: 40px;
    margin: -4px 0 2px;
    opacity: 1;
    transform: translateY(0);
    overflow: hidden;
    transition:
      max-height 650ms ease,
      margin 650ms ease,
      opacity 450ms ease,
      transform 650ms cubic-bezier(0.22, 1, 0.36, 1);
  }

.remember-me__label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-sec);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
}

.remember-me__label input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--orange);
  cursor: pointer;
}

  .btn {
    width: 100%;
    height: 50px;
    margin-top: 10px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(160deg, var(--orange) 0%, var(--orange) 100%);
    color: white;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 24px -7px rgba(53,105,158,.32), 0 3px 8px rgba(201,130,58,.10);
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.18) 35%, rgba(201,130,58,.16) 50%, rgba(255,255,255,.18) 65%, transparent 100%);
    transform: translateX(-110%);
    animation: buttonSheen 5.5s ease-in-out 4s infinite;
    pointer-events: none;
  }

  @keyframes buttonSheen {
    0%, 65%, 100% { transform: translateX(-110%); }
    82% { transform: translateX(110%); }
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px -6px rgba(31, 45, 61, 0.18);
  }

  .btn:active {
    transform: translateY(0);
  }

  .login-panel.is-register {
    width: min(800px, 94vw);
    padding-left: 40px;
    padding-right: 40px;
  }

  .login-panel.is-register .workspace-form {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 34px;
  }

  .login-panel.is-register .workspace-section--security {
    padding-left: 34px;
    border-left: 1px solid rgba(53,105,158,.12);
  }

  .login-panel.is-register .section-heading {
    opacity: 1;
    transform: translateY(0);
  }

  .login-panel.is-register .avatar-field {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .login-panel.is-register .workspace-section--identity {
    transform: translateX(0);
  }

  .login-panel.is-register .workspace-section--security {
    transform: translateX(0);
  }

  .login-panel.is-register .remember-me {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
  }

  #confirm-group {
    opacity: 0;
    transform: translateY(-10px);
    overflow: hidden;
    pointer-events: none;
    transition:
      max-height 750ms ease,
      margin-bottom 750ms ease,
      opacity 500ms ease,
      transform 750ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .login-panel.is-register #confirm-group {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .plan-stage {
    transition: transform 950ms cubic-bezier(0.22, 1, 0.36, 1), opacity 950ms ease;
  }

  .plan-stage.is-transitioning {
    transform: scale(1.012);
  }

  .plan-stage.is-transitioning::after {
    opacity: 1.12;
    transform: translate(-50%, -50%) scale(1.08);
  }

  /* ===== SMOOTH CONTENT TRANSITIONS ===== */
  .welcome h1 { min-height: 31px; }
  .welcome p { min-height: 20px; }

  .welcome-text {
    display: block;
    transition:
      opacity 420ms ease,
      transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .welcome-text--register,
  .login-panel.is-register .welcome-text--login {
    opacity: 0;
    transform: translateY(9px);
  }

  .welcome-text--login,
  .login-panel.is-register .welcome-text--register {
    opacity: 1;
    transform: translateY(0);
  }

  .btn-label {
    display: block;
    transition:
      opacity 350ms ease,
      transform 650ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .btn-label--register,
  .login-panel.is-register .btn-label--login {
    opacity: 0;
    transform: translateY(8px);
  }

  .btn-label--login,
  .login-panel.is-register .btn-label--register {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 700px) {
    .login-panel.is-register {
      width: min(94vw, 520px);
      padding: 32px 26px 28px;
    }

    .login-panel.is-register .workspace-form {
      grid-template-columns: 1fr;
      column-gap: 0;
    }

    .login-panel.is-register .workspace-section--security {
      padding-left: 0;
      border-left: none;
      padding-top: 4px;
    }

    .login-panel.is-register .section-heading {
      margin-top: 4px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .draw, .fade-in, .panel-wrapper, .technical-pulse, .plan-stage::after, .btn::after,
    .login-panel, .workspace-form, .workspace-section, .plan-stage, .avatar-button,
    .section-heading, .avatar-field, .remember-me, #confirm-group,
    .welcome-text, .btn-label {
      animation: none !important;
      transition: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

  <!-- TECHNICAL PLAN -->
  <div class="plan-stage">
    <svg class="plan-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
      <g class="fade-in" stroke="#35699E" stroke-opacity="0.04" stroke-width="0.6">
        <path d="M0 100 H1440 M0 200 H1440 M0 300 H1440 M0 400 H1440 M0 500 H1440 M0 600 H1440 M0 700 H1440 M0 800 H1440"/>
        <path d="M100 0 V900 M200 0 V900 M300 0 V900 M400 0 V900 M500 0 V900 M600 0 V900 M700 0 V900 M800 0 V900 M900 0 V900 M1000 0 V900 M1100 0 V900 M1200 0 V900 M1300 0 V900"/>
      </g>

      <g stroke="#35699E" stroke-opacity="0.18" stroke-width="1.2" stroke-linecap="round">
        <rect class="draw" x="180" y="90" width="1080" height="720" rx="2"/>
        <line class="draw draw-delay-1" x1="180" y1="270" x2="1260" y2="270"/>
        <line class="draw draw-delay-1" x1="180" y1="540" x2="1260" y2="540"/>
        <line class="draw draw-delay-2" x1="480" y1="90" x2="480" y2="810"/>
        <line class="draw draw-delay-2" x1="960" y1="90" x2="960" y2="810"/>
      </g>

      <g stroke="#35699E" stroke-opacity="0.12" stroke-width="1" fill="none">
        <rect class="draw draw-delay-3" x="220" y="130" width="220" height="110" rx="1"/>
        <rect class="draw draw-delay-3" x="1000" y="620" width="220" height="140" rx="1"/>
        <rect class="draw draw-delay-4" x="520" y="310" width="400" height="200" rx="1"/>
      </g>

      <g stroke="#35699E" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round">
        <line class="draw draw-delay-3" x1="220" y1="70" x2="440" y2="70"/>
        <line class="draw draw-delay-3" x1="220" y1="64" x2="220" y2="76"/>
        <line class="draw draw-delay-3" x1="440" y1="64" x2="440" y2="76"/>
        <line class="draw draw-delay-4" x1="150" y1="130" x2="150" y2="240"/>
        <line class="draw draw-delay-4" x1="144" y1="130" x2="156" y2="130"/>
        <line class="draw draw-delay-4" x1="144" y1="240" x2="156" y2="240"/>
      </g>

      <g class="fade-in fade-delay-2" fill="#35699E" fill-opacity="0.25">
        <circle cx="220" cy="130" r="3"/>
        <circle cx="440" cy="130" r="3"/>
        <circle cx="480" cy="270" r="3"/>
        <circle cx="960" cy="540" r="3"/>
        <circle cx="1000" cy="620" r="3"/>
      </g>

      <g class="fade-in fade-delay-3" fill="#C9823A" fill-opacity="0.55">
        <circle cx="520" cy="310" r="3.5"/>
        <circle class="technical-pulse" cx="720" cy="410" r="5" fill="#C9823A" fill-opacity=".28"/>
        <circle cx="920" cy="510" r="2.5"/>
        <rect x="1220" y="730" width="8" height="8" rx="1"/>
      </g>

      <g class="fade-in fade-delay-3" stroke="#C9823A" stroke-opacity=".34" stroke-width="1.4">
        <path d="M500 300 L520 280 L540 300 L520 320 Z"/>
        <path d="M900 500 L920 480 L940 500 L920 520 Z"/>
      </g>

      <text class="fade-in fade-delay-1" x="720" y="460" text-anchor="middle"
            font-family="system-ui, sans-serif" font-size="92" font-weight="700"
            fill="#35699E" fill-opacity="0.03" letter-spacing="-2">BATORYA</text>
    </svg>
  </div>

  <!-- LOGIN PANEL -->
  <div class="panel-wrapper">
    <div class="login-panel" id="login-panel">
      <div class="logo">
        <img src="../../assets/icon.png" alt="BATORYA" onerror="this.style.display='none'">
      </div>

      <div class="mode-switch">
        <button type="button" class="mode-btn active" data-mode="login">Se connecter</button>
        <button type="button" class="mode-btn" data-mode="register">Créer mon espace</button>
      </div>

      <div class="welcome">
        <h1 id="welcome-title">
          <span class="welcome-text welcome-text--login">Bienvenue</span>
          <span class="welcome-text welcome-text--register">Créons votre espace</span>
        </h1>
        <p id="welcome-subtitle">
          <span class="welcome-text welcome-text--login">Connectez-vous à BATORYA Essentiel</span>
          <span class="welcome-text welcome-text--register">Votre accès personnel à BATORYA Essentiel</span>
        </p>
      </div>

      <div class="workspace-form" id="workspace-form">
        <section class="workspace-section workspace-section--identity">
          <div class="section-heading">Identité</div>

          <div class="form-group">
            <label for="id">Identifiant</label>
            <input type="text" id="id" placeholder="Identifiant" autocomplete="username">
          </div>

          <div class="avatar-field" id="avatar-field">
            <input type="file" id="avatar-input" accept="image/*" hidden>
            <button type="button" class="avatar-button" id="avatar-button" aria-label="Ajouter une photo de profil">
              <span class="avatar-placeholder" id="avatar-placeholder">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 13.2a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4Z" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M4.8 20.2c.9-3.1 3.4-4.7 7.2-4.7s6.3 1.6 7.2 4.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span>Photo</span>
              </span>
              <img class="avatar-image" id="avatar-image" alt="Aperçu de la photo de profil">
            </button>
            <div class="avatar-caption" id="avatar-caption">Ajouter une photo de profil</div>
          </div>
        </section>

        <section class="workspace-section workspace-section--security">
          <div class="section-heading">Sécurité</div>

          <div class="form-group">
            <label for="pwd">Mot de passe</label>
            <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password">
          </div>

          <div class="form-group" id="confirm-group" style="display: none;">
            <label for="pwd2">Confirmer le mot de passe</label>
            <input type="password" id="pwd2" placeholder="••••••••" autocomplete="new-password">
          </div>

          <div class="remember-me" id="remember-group">
            <label class="remember-me__label">
              <input type="checkbox" id="remember-me">
              <span>Se souvenir de moi</span>
            </label>
          </div>

          <button class="btn" type="button" id="submit-btn">
            <span class="btn-label btn-label--login">Se connecter</span>
            <span class="btn-label btn-label--register">Créer mon espace</span>
          </button>
        </section>
      </div>
    </div>
  </div>

  <script>
    const loginPanel = document.getElementById('login-panel');
    const planStage = document.querySelector('.plan-stage');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const title = document.getElementById('welcome-title');
    const subtitle = document.getElementById('welcome-subtitle');
    const confirmGroup = document.getElementById('confirm-group');
    const submitBtn = document.getElementById('submit-btn');
    const rememberGroup = document.getElementById('remember-group');
    const avatarField = document.getElementById('avatar-field');
    const avatarInput = document.getElementById('avatar-input');
    const avatarButton = document.getElementById('avatar-button');
    const avatarPlaceholder = document.getElementById('avatar-placeholder');
    const avatarImage = document.getElementById('avatar-image');
    const avatarCaption = document.getElementById('avatar-caption');

    let currentMode = 'login';
    let transitionTimer = null;

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const nextMode = btn.dataset.mode;
        if (nextMode === currentMode) return;

        modeBtns.forEach(b => b.classList.toggle('active', b === btn));
        currentMode = nextMode;

        clearTimeout(transitionTimer);
        planStage.classList.add('is-transitioning');

        if (nextMode === 'register') {
          loginPanel.classList.add('is-register');
          // Les éléments restent dans le DOM : leur apparition est animée par CSS.
        } else {
          loginPanel.classList.remove('is-register');
          // Les éléments se replient progressivement vers le mode connexion.
        }

        transitionTimer = setTimeout(() => {
          planStage.classList.remove('is-transitioning');
        }, 800);
      });
    });

    avatarButton.addEventListener('click', () => avatarInput.click());

    avatarInput.addEventListener('change', () => {
      const [file] = avatarInput.files || [];
      if (!file) return;

      const reader = new FileReader();
      reader.addEventListener('load', () => {
        avatarImage.src = reader.result;
        avatarImage.style.display = 'block';
        avatarPlaceholder.style.display = 'none';
        avatarCaption.textContent = 'Modifier la photo';
      });
      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
