<!doctype html>
<html lang="fr" data-theme="light" data-density="confort">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATORYA Essentiel V6 — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   BATORYA Essentiel V6 — « Chaux & Ardoise »
   Tokens → base → layout → composants → vues
   ========================================================= */
:root{
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail-w:236px; --leon-w:0px;
  --row:44px; --gap:20px; --pad-x:28px;
  --r:10px; --ease:cubic-bezier(.2,.7,.2,1);
}
:root,[data-theme="light"]{
  color-scheme:light;
  --bg:#ECE9E2; --surface:#F8F6F1; --surface-2:#F1EEE7; --raised:#FFFFFF; --hover:rgba(28,32,30,.045);
  --line:#DAD4C8; --line-2:#E6E1D7; --line-strong:#C3BCAE;
  --ink:#1C201E; --ink-2:#4A504C; --ink-3:#7A7F79; --ink-inv:#F8F6F1;
  --accent:#B4501D; --accent-hover:#9C4415; --accent-ink:#FFFFFF; --accent-soft:#F2E0D3; --accent-line:#E3BFA7;
  --leon:#2D4D5F; --leon-soft:#DCE5EA;
  --ok:#3B6E45; --ok-soft:#DCE8DB; --warn:#94690F; --warn-soft:#F1E5C6; --bad:#A3372B; --bad-soft:#F3DBD6; --info:#2D4D5F; --info-soft:#DCE5EA;
  --chip:#E7E3DA;
  --rail:#1C2220; --rail-ink:#EDE9E0; --rail-ink-2:#B6B3AA; --rail-ink-3:#7C807A; --rail-hover:rgba(255,255,255,.05); --rail-active:rgba(255,255,255,.085); --rail-line:#1C2220; --rail-sep:rgba(255,255,255,.07);
  --chart-out:#C8C1B3;
  --paper:#FFFEFB; --paper-ink:#1C201E; --paper-line:#E4DFD5;
  --toast-ic:#9FD3A8;
  --shadow:0 1px 2px rgba(28,32,30,.06),0 4px 14px rgba(28,32,30,.06);
  --shadow-lg:0 14px 44px rgba(28,32,30,.20);
  --scrim:rgba(24,27,25,.34);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101315; --surface:#161A1C; --surface-2:#1B2023; --raised:#20262A; --hover:rgba(233,229,220,.045);
  --line:#293034; --line-2:#21272A; --line-strong:#3A4246;
  --ink:#E9E5DC; --ink-2:#B3B0A8; --ink-3:#82847E; --ink-inv:#111416;
  --accent:#E07840; --accent-hover:#EA8A55; --accent-ink:#1A0E07; --accent-soft:rgba(224,120,64,.14); --accent-line:rgba(224,120,64,.38);
  --leon:#8DB4C8; --leon-soft:rgba(141,180,200,.13);
  --ok:#86B98E; --ok-soft:rgba(134,185,142,.13); --warn:#D9B25A; --warn-soft:rgba(217,178,90,.13); --bad:#E58A7C; --bad-soft:rgba(229,138,124,.14); --info:#8DB4C8; --info-soft:rgba(141,180,200,.13);
  --chip:#232A2E;
  --rail:#0B0E0F; --rail-ink:#E9E5DC; --rail-ink-2:#A7A59D; --rail-ink-3:#6B6E69; --rail-hover:rgba(255,255,255,.04); --rail-active:rgba(255,255,255,.07); --rail-line:#1D2326; --rail-sep:rgba(255,255,255,.06);
  --chart-out:#3D464B;
  --paper:#E9E5DC; --paper-ink:#1C201E; --paper-line:#CEC8BC;
  --toast-ic:#2F6B3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.5);
}
[data-density="compact"]{--row:36px;--gap:14px;--pad-x:22px}
[data-motion="reduce"] *,[data-motion="reduce"] *::before,[data-motion="reduce"] *::after{transition:none!important;animation:none!important}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.t-bad{color:var(--bad)} .t-warn{color:var(--warn)} .t-ok{color:var(--ok)} .t-acc{color:var(--accent)}
.r{text-align:right}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lv{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}
.lv .lv-t{opacity:.45;stroke-width:1.2}
.lv .lv-b{fill:currentColor;stroke:none}
.thinking .lv-b{animation:bub 1.1s ease-in-out infinite}
@keyframes bub{0%,100%{transform:translateX(-2.4px)}50%{transform:translateX(2.4px)}}
.bm-bg{fill:var(--accent)} .bm-b{fill:#fff}
kbd{font:500 10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface-2);color:var(--ink-2)}
.lnk{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:none}
.lnk:hover{color:var(--accent)}
a.lnk,.u{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr) var(--leon-w);height:100vh;transition:grid-template-columns .3s var(--ease)}
body.rail-min{--rail-w:68px}
body.leon-open{--leon-w:384px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.content{flex:1;overflow:auto;min-height:0}
.view{padding:22px var(--pad-x) 48px}
.view.anim{animation:vin .24s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(4px)}}

/* ---------- rail ---------- */
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:14px 12px 12px;min-width:0;overflow:hidden;border-right:1px solid var(--rail-line)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;white-space:nowrap}
.brand-mark{width:30px;height:30px;flex:none}
.brand-txt b{display:block;font-weight:700;font-size:13.5px;letter-spacing:.17em}
.brand-txt span{display:block;font:500 10.5px var(--mono);color:var(--rail-ink-3);letter-spacing:.04em;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden;margin:0 -12px;padding:0 12px;scrollbar-width:none}
.nav-g{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rail-ink-3);padding:14px 10px 6px;white-space:nowrap}
.nav-i{position:relative;display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--rail-ink-2);text-align:left;white-space:nowrap;transition:background .15s,color .15s;width:100%}
.nav-i:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav-i.on{background:var(--rail-active);color:var(--rail-ink)}
.nav-i.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-i .lbl{flex:1;font-weight:500;font-size:13.5px}
.nav-i .n{font:500 10.5px var(--mono);color:var(--rail-ink-3)}
.nav-i.on .n{color:var(--accent)}
.nav-i .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font:600 10.5px var(--mono);display:grid;place-items:center}
.rail-foot{border-top:1px solid var(--rail-sep);padding-top:10px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.who{display:flex;align-items:center;gap:10px;padding:10px 6px 2px;white-space:nowrap}
.who-av{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font:600 11px var(--mono);color:var(--rail-ink);flex:none}
.who b{display:block;font-size:12.5px;font-weight:600}
.who span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--rail-ink-3)}
.who span i{width:6px;height:6px;border-radius:50%;background:#6FBF7B;display:inline-block}
body.rail-min .lbl,body.rail-min .n,body.rail-min .brand-txt,body.rail-min .who-t,body.rail-min .badge{display:none}
body.rail-min .nav-g{height:12px;padding:0;overflow:hidden;color:transparent}
body.rail-min .nav-i{justify-content:center;padding:0}
body.rail-min .brand,body.rail-min .who{justify-content:center;padding-left:0;padding-right:0}

/* ---------- header (cartouche) ---------- */
.head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px var(--pad-x) 0;position:relative;flex:none}
.head-top{display:flex;align-items:center;gap:16px;min-height:44px}
.cart{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.cart-n{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--raised);font:600 15px var(--mono);color:var(--accent);position:relative;overflow:hidden}
.cart-n::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;background:repeating-linear-gradient(135deg,transparent 0 2px,var(--line) 2px 3px);border-top-left-radius:3px}
.cart-t{min-width:0}
.crumbs{display:flex;align-items:center;gap:6px;font:500 11px var(--mono);color:var(--ink-3);letter-spacing:.03em;white-space:nowrap;overflow:hidden}
.crumbs .sep{opacity:.5}
.crumbs b{color:var(--ink-2);font-weight:500}
.cart h1{margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-tools{display:flex;align-items:center;gap:8px}
.st{display:flex;align-items:center;gap:10px;height:36px;width:330px;padding:0 8px 0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink-3);text-align:left;transition:border-color .15s}
.st:hover{border-color:var(--line-strong);color:var(--ink-2)}
.st .st-t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.leon-btn{color:var(--leon)!important}
.leon-btn.on{background:var(--leon-soft)!important;border-color:transparent!important}
.head-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.tab{position:relative;height:42px;padding:0 12px;border:0;background:none;color:var(--ink-3);font-weight:500;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.tab .ct{font:500 10.5px var(--mono);color:var(--ink-3);margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--chip)}
.tab .ct.bad{background:var(--bad-soft);color:var(--bad)}
.head-act{display:flex;gap:8px;padding-bottom:9px;flex-wrap:wrap;justify-content:flex-end}
.ruler{position:absolute;left:0;right:0;bottom:0;height:9px;pointer-events:none;
  background:
   repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 60px) left bottom/100% 9px no-repeat,
   repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px) left bottom/100% 4px no-repeat}

/* ---------- boutons & champs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .06s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;gap:6px}
.btn.icon{width:34px;padding:0}
.btn.icon.sm{width:28px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.input{height:34px;width:100%;border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:0 10px;transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--line-strong)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{height:auto;padding:9px 10px;resize:vertical;line-height:1.5}
select.input{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sbox{position:relative;display:block;width:280px;max-width:100%}
.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.sbox .input{padding-left:32px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;font-weight:500;color:var(--ink-2)}
.fld.span2{grid-column:1/-1}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hint{font-size:12px;color:var(--ink-3)}
.switch{width:38px;height:22px;border-radius:11px;background:var(--line-strong);border:0;position:relative;transition:background .2s;flex:none;padding:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)} .switch.on::after{left:19px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:none;height:28px;padding:0 11px;border-radius:6px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- conteneurs ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2);min-height:54px}
.panel-h h3{margin:0;font-size:13.5px;font-weight:600}
.panel-s{font:500 11px var(--mono);color:var(--ink-3);margin-top:2px}
.panel-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pad{padding:16px}
.g2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:var(--gap);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.back{margin:-6px 0 12px -8px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.meta svg{width:14px;height:14px}
.callout{padding:11px 13px;border-radius:8px;background:var(--warn-soft);color:var(--ink-2);font-size:12.5px;line-height:1.5}
.callout.info{background:var(--leon-soft)}
h4.sub{margin:0 0 8px;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}

/* ---------- chips & statuts ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.chip span{font:500 11px var(--mono);color:var(--ink-3)}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ink-inv)}
.chip.on span{color:inherit;opacity:.65}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.accent{background:var(--accent-soft);color:var(--accent)} .pill.muted{color:var(--ink-3)}
.tag{display:inline-block;font:500 10.5px var(--mono);padding:2px 6px;border-radius:4px;background:var(--chip);color:var(--ink-2)}

/* ---------- tableaux ---------- */
.tbl-wrap{overflow:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1}
.tbl td{padding:0 14px;height:var(--row);border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl .ref{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.tbl .ell{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl b{font-weight:600}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
.who-cell{display:flex;align-items:center;gap:10px;padding:6px 0}
.who-cell small{display:block;color:var(--ink-3);font-size:12px}
.av{width:30px;height:30px;border-radius:8px;background:var(--chip);color:var(--ink-2);display:grid;place-items:center;font:600 11px var(--mono);flex:none}
.av.lg{width:54px;height:54px;border-radius:13px;font-size:16px;background:var(--accent-soft);color:var(--accent)}
.av.pro{background:var(--leon-soft);color:var(--leon)}
.rel{font:500 12px var(--mono)}

/* ---------- barres ---------- */
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;position:relative;flex:1}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .45s var(--ease)}
.bar.ok>i{background:var(--ok)}
.bar.lg{height:12px;border-radius:3px}
.bar.ruled::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1.5px),var(--surface) calc(10% - 1.5px) 10%)}

/* ---------- accueil ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:2px 0 18px;flex-wrap:wrap}
.hello h2{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:6px 0 4px}
.lead{margin:0;color:var(--ink-2);font-size:14.5px}
.leon-hint{color:var(--leon);border-color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--gap)}
.kpi{padding:15px 18px;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi-l{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi-v{font-size:24px;font-weight:600;letter-spacing:-.025em;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-s{font-size:12px;color:var(--ink-3)}
.kpi-s b{font-weight:500}
.prio{list-style:none;margin:0;padding:4px 0}
.prio li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.prio li:last-child{border-bottom:0}
.ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-strong);background:none;display:grid;place-items:center;color:transparent;padding:0;transition:.15s}
.ck svg{width:13px;height:13px;stroke-width:2.4}
.ck:hover{border-color:var(--ok);color:var(--ok)}
.ck.on,.prio li.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.prio li.done .pt{text-decoration:line-through;color:var(--ink-3)}
.prio li.done .ps{opacity:.6}
.pt{font-weight:500}
.ps{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.lvl{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px}
.prio .acts{display:flex;gap:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-right:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:0;width:12px;border-top:1.5px dashed var(--ink);border-radius:0;vertical-align:3px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--line-2);stroke-width:1}
.c-lbl{fill:var(--ink-3);font:10.5px var(--mono)}
.c-in{fill:var(--accent)} .c-out{fill:var(--chart-out)}
.c-net{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.c-dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.c-part{opacity:.55}
.agenda{list-style:none;margin:0;padding:4px 0}
.agenda li{display:grid;grid-template-columns:40px 3px minmax(0,1fr);gap:12px;padding:9px 16px;cursor:pointer;align-items:center}
.agenda li:hover{background:var(--hover)}
.ag-d{font:500 10.5px var(--mono);color:var(--ink-3);text-transform:uppercase;line-height:1.25;text-align:center}
.ag-d b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.evk{align-self:stretch;border-radius:2px}
.ag-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-s{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chl{padding:4px 0}
.chl-i{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.chl-i:last-child{border-bottom:0}
.chl-i:hover{background:var(--hover)}
.chl-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.chl-top b{display:block;font-weight:600}
.chl-top small{display:block;color:var(--ink-3);font-size:12px}
.chl-b{display:flex;align-items:center;gap:10px}
.chl-b span{font-size:12px;width:40px;text-align:right}
.chl-d{font-size:11px;color:var(--ink-3);margin-top:6px}

/* ---------- fiche client ---------- */
.idcard{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:22px;align-items:center;padding:18px 20px;margin-bottom:var(--gap)}
.id-main{display:flex;gap:14px;align-items:center;min-width:0}
.id-main h2{margin:0 0 6px;font-size:21px;letter-spacing:-.02em}
.id-contacts{display:flex;flex-direction:column;gap:1px;min-width:0}
.contact{display:flex;gap:9px;align-items:center;border:0;background:none;padding:4px 7px;border-radius:6px;color:var(--ink-2);text-align:left;font-size:13px;min-width:0}
.contact span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact:hover{background:var(--hover);color:var(--ink)}
.minis{display:flex}
.mini{padding:0 16px;border-left:1px solid var(--line-2)}
.mini span{display:block;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);white-space:nowrap}
.mini b{display:block;font-size:17px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{list-style:none;margin:0;padding:10px 16px 14px}
.tl li{position:relative;padding:7px 0 7px 26px}
.tl li::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--line)}
.tl li:first-child::before{top:16px} .tl li:last-child::before{bottom:calc(100% - 16px)}
.tl li:only-child::before{display:none}
.tl .dot{position:absolute;left:2px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl .dot.acc{border-color:var(--accent)} .tl .dot.ok{border-color:var(--ok);background:var(--ok)} .tl .dot.bad{border-color:var(--bad)} .tl .dot.info{border-color:var(--leon)}
.tl b{font-weight:500;display:block}
.tl small{color:var(--ink-3);font-size:12px;display:block}
.tl .when{font:500 10.5px var(--mono);color:var(--ink-3)}
.quick{display:flex;gap:6px;padding:0 16px 14px;flex-wrap:wrap}
.day-h{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);padding:16px 16px 4px}

/* ---------- devis ---------- */
.devis-wrap{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:var(--gap);align-items:start}
.paper-zone{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:28px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.08);padding:44px 48px;max-width:800px;margin:0 auto;font-size:12.5px;line-height:1.5}
.paper .bm-bg{fill:#B4501D}
.pp-h{display:flex;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:2px solid var(--paper-ink)}
.pp-co{display:flex;gap:12px}
.pp-co svg{width:34px;height:34px;flex:none}
.pp-co b{display:block;font-size:14px}
.pp-co span{display:block;color:#5d625e;font-size:11.5px}
.pp-ref{text-align:right;font-size:11.5px;color:#5d625e}
.pp-kind{font:700 21px var(--font);letter-spacing:.16em;color:var(--paper-ink)}
.pp-ref .mono{font-size:13px;color:#B4501D;font-weight:600;margin:2px 0 6px}
.pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.pp-lbl{display:block;font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8a8e88;margin-bottom:4px}
.pp-to b{display:block;font-size:13px}
.pp-to span{display:block;color:#4b504c}
.pp-t{width:100%;border-collapse:collapse;margin-top:24px}
.pp-t th{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#7c807a;text-align:left;padding:8px 6px;border-bottom:1px solid var(--paper-ink)}
.pp-t td{padding:8px 6px;border-bottom:1px solid var(--paper-line);vertical-align:top;font-variant-numeric:tabular-nums}
.pp-t .r{text-align:right;white-space:nowrap}
.pp-code{font:500 9.5px var(--mono);color:#8a8e88;display:block}
.pp-tot{margin:16px 0 0 auto;width:290px}
.pp-tot div{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
.pp-tot .big{border-top:2px solid var(--paper-ink);margin-top:6px;padding-top:8px;font-weight:700;font-size:14px}
.pp-tot .acpt{color:#6d716c;font-size:11.5px}
.pp-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
.pp-sign div{border:1px dashed #b9b3a7;border-radius:4px;height:76px;padding:8px 10px;font-size:10.5px;color:#7c807a}
.pp-f{margin-top:22px;padding-top:12px;border-top:1px solid var(--paper-line);font-size:10px;color:#6d716c;line-height:1.55}
.side-acts{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.side-acts .btn{justify-content:flex-start;width:100%}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:0;font-size:13px;padding:14px 16px}
.dl dt{color:var(--ink-3)} .dl dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.leon-card{margin:0 16px 16px;padding:12px 14px;border-radius:9px;background:var(--leon-soft);font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.leon-card b{color:var(--leon);display:flex;align-items:center;gap:6px;font-weight:600}

/* ---------- éditeur ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--gap);align-items:start}
.sticky{position:sticky;top:0}
.tbl.ed td{padding:5px 6px;height:auto}
.tbl.ed td:first-child{padding-left:12px}
.input.cell{height:32px;background:transparent;border-color:transparent}
.input.cell:hover{border-color:var(--line)}
.input.cell:focus{background:var(--raised)}
.input.cell.r{text-align:right;font-family:var(--mono)}
.input.err{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.line-code{font:500 10px var(--mono);color:var(--ink-3);padding-left:11px}
.tot-box{padding:16px}
.tot-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;font-variant-numeric:tabular-nums}
.tot-row.sm{font-size:12.5px;color:var(--ink-2)}
.tot-row.big{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:18px;font-weight:600;letter-spacing:-.01em}
.ed-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.ed-foot .btn{flex:1 1 auto}
.pick-list{max-height:52vh;overflow:auto;padding:0 8px 8px}
.pick{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 10px;border:0;background:none;border-radius:7px;text-align:left}
.pick:hover{background:var(--hover)}
.pick small{color:var(--ink-3)}

/* ---------- chantier ---------- */
.ch-head{padding:18px 20px;margin-bottom:var(--gap)}
.ch-h1{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.ch-h1 h2{margin:4px 0 6px;font-size:21px;letter-spacing:-.02em}
.ch-prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-top:18px}
.ch-p-n{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ch-p-n small{font-size:15px;color:var(--ink-3);margin-left:2px}
.ch-dates{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:8px}
.phases{list-style:none;margin:0;padding:6px 0}
.phases li{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.phases li:last-child{border-bottom:0}
.phases .pn{font:500 10.5px var(--mono);color:var(--ink-3);width:22px}
.phases li.done .ph{color:var(--ink-3);text-decoration:line-through}
.phases li.next .ph{font-weight:600}
.phases .nx{margin-left:auto;font:500 10.5px var(--mono);color:var(--accent)}
.jform{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.journal{list-style:none;margin:0;padding:6px 16px 12px}
.journal li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.journal li:last-child{border-bottom:0}
.journal time{font:500 11px var(--mono);color:var(--ink-3);padding-top:2px}
.budget{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.brow{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.brow.big{font-size:15px;font-weight:600;padding-top:8px;border-top:1px solid var(--line-2)}
.mini-list{list-style:none;margin:0;padding:6px 0}
.mini-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 16px;font-size:13px}
.mini-list li:hover{background:var(--hover)}
.mini-list li.click{cursor:pointer}

/* ---------- gantt ---------- */
.g-head,.g-row{display:grid;grid-template-columns:250px minmax(0,1fr)}
.g-head{border-bottom:1px solid var(--line);font:500 10.5px var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.g-head>div:first-child{padding:10px 16px}
.g-weeks{display:grid;grid-template-columns:repeat(8,1fr)}
.g-weeks div{padding:10px 8px;border-left:1px solid var(--line-2)}
.g-row{border-bottom:1px solid var(--line-2);min-height:60px}
.g-row:last-child{border-bottom:0}
.g-lbl{padding:10px 16px;min-width:0}
.g-lbl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lbl small{color:var(--ink-3);font-size:12px}
.g-track{position:relative;background-image:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 12.5%)}
.g-bar{position:absolute;top:17px;height:26px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent-line);cursor:pointer;overflow:hidden;padding:0}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.9}
.g-bar.done{background:var(--ok-soft);border-color:transparent}
.g-bar.done i{background:var(--ok)}
.g-pct{position:absolute;top:21px;font:600 11px var(--mono);color:var(--ink-2);white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--accent);z-index:1}
.g-today span{position:absolute;top:2px;left:4px;font:600 9.5px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}

/* ---------- drawer, modal, palette, toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(480px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .28s var(--ease);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.open{transform:none}
.dr-h{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.dr-h h3{margin:4px 0 8px;font-size:17px}
.dr-b{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.dr-b .dl{padding:0}
.dr-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);flex-wrap:wrap}
.dr-amt{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dr-amt span{display:block;font:500 10.5px var(--mono);text-transform:uppercase;color:var(--ink-3);letter-spacing:.06em}
.dr-amt b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.pays{list-style:none;margin:0;padding:0;border:1px solid var(--line-2);border-radius:8px}
.pays li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:13px}
.pays li:last-child{border-bottom:0}
.payf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface-2)}
.payf .btn{grid-column:1/-1}
.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-wrap.open{opacity:1;pointer-events:auto}
.modal{width:min(540px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);transform:translateY(6px) scale(.99);transition:transform .2s var(--ease);overflow:hidden}
.modal.wide{width:min(780px,100%)}
.modal-wrap.open .modal{transform:none}
.modal>form{display:flex;flex-direction:column;min-height:0}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.modal-h h3{margin:0;font-size:15px}
.modal-b{padding:18px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.pal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;justify-content:center;padding-top:12vh;opacity:0;pointer-events:none;transition:opacity .15s}
.pal-wrap.open{opacity:1;pointer-events:auto}
.pal{width:min(640px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;align-self:flex-start;transform:translateY(-6px);transition:transform .2s var(--ease)}
.pal-wrap.open .pal{transform:none}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{color:var(--ink-3)}
.pal-in input{flex:1;border:0;background:none;font-size:15px;outline:none}
.pal-res{max-height:52vh;overflow:auto;padding:6px}
.pal-g{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding:10px 10px 4px}
.pal-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:7px;text-align:left}
.pal-i span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-i small{margin-left:auto;font:500 11px var(--mono);color:var(--ink-3);white-space:nowrap}
.pal-i.sel{background:var(--accent-soft)}
.pal-i.sel svg{color:var(--accent)}
.pal-foot{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:11px;background:var(--ink);color:var(--ink-inv);padding:9px 10px 9px 14px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;animation:tin .25s var(--ease);transition:opacity .25s,transform .25s;max-width:min(560px,92vw)}
.toast>svg{color:var(--toast-ic)}
.toast .tb{border:0;background:rgba(127,127,127,.22);color:inherit;border-radius:6px;padding:4px 9px;font-weight:600;font-size:12.5px}
.toast.err>svg{color:#F0A196}
.toast.out{opacity:0;transform:translateY(6px)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- Léon ---------- */
.leon{background:var(--surface);min-width:0;overflow:hidden;overflow:clip;position:relative;z-index:5}
body.leon-open .leon{border-left:1px solid var(--line)}
.leon-in{width:384px;height:100%;display:flex;flex-direction:column}
.leon-h{display:flex;align-items:center;gap:11px;padding:15px 14px 13px 16px;border-bottom:1px solid var(--line-2)}
.leon-mark{width:34px;height:34px;border-radius:10px;background:var(--leon-soft);color:var(--leon);display:grid;place-items:center;flex:none}
.leon-mark .lv{width:22px;height:22px}
.leon-id{flex:1;min-width:0}
.leon-id b{display:block;font-size:14px}
.leon-id span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.leon-id span i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.leon-ctx{display:flex;align-items:center;gap:7px;padding:8px 16px;font:500 11px var(--mono);color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.leon-ctx b{color:var(--leon);font-weight:600}
.leon-ctx svg{width:13px;height:13px}
.leon-msgs{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{flex:none;max-width:90%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--ink-inv);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line-2);border-bottom-left-radius:4px}
.msg.bot b{font-weight:600}
.msg .l-list{list-style:none;margin:8px 0 0;padding:0}
.msg .l-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.msg .l-list li small{display:block;color:var(--ink-3);font-size:11.5px}
.msg .l-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.draft{white-space:pre-wrap;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:8px;line-height:1.55}
.typing{display:flex;gap:4px;padding:13px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:dots 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.leon-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.sugg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink-2);text-align:left;transition:.15s}
.sugg:hover{border-color:var(--leon);color:var(--leon)}
.leon-form{display:flex;gap:8px;padding:12px 16px 8px;border-top:1px solid var(--line-2)}
.leon-note{font-size:11px;color:var(--ink-3);padding:0 16px 12px}

/* ---------- planning ---------- */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;--ph:46px}
.wk-hd{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.wk-d{padding:10px 12px;border-left:1px solid var(--line-2);display:flex;align-items:baseline;gap:8px;cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left}
.wk-d span{font:500 10.5px var(--mono);text-transform:uppercase;color:var(--ink-3);letter-spacing:.07em}
.wk-d b{font-size:18px;font-weight:600}
.wk-d.today b{color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:0 7px}
.wk-d em{margin-left:auto;font:normal 500 10.5px var(--mono);color:var(--ink-3)}
.wk-body{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));max-height:calc(100vh - 286px);min-height:360px;overflow:auto}
.wk-times div{height:var(--ph);font:500 10.5px var(--mono);color:var(--ink-3);text-align:right;padding:2px 8px 0 0}
.wk-col{position:relative;border-left:1px solid var(--line-2);background-image:repeating-linear-gradient(to bottom,var(--line-2) 0 1px,transparent 1px var(--ph));cursor:copy}
.wk-col.we{background-color:var(--surface-2)}
.wk-col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:5px 8px;text-align:left;border:0;border-left:3px solid;overflow:hidden;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:box-shadow .15s}
.ev b{font-weight:600;font-size:12px}
.ev span{font:500 10.5px var(--mono);color:var(--ink-2)}
.ev small{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.chantier{background:var(--accent-soft);border-color:var(--accent)}
.ev.rdv{background:var(--leon-soft);border-color:var(--leon)}
.ev.admin{background:var(--warn-soft);border-color:var(--warn)}
.ev:hover{box-shadow:0 0 0 1px var(--line-strong),var(--shadow)}
.legend-ev{display:flex;gap:14px;font-size:12px;color:var(--ink-3)}
.legend-ev i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border-left:3px solid}
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mo-h{background:var(--surface);padding:9px 10px;font:500 10.5px var(--mono);text-transform:uppercase;color:var(--ink-3);letter-spacing:.07em}
.mo-c{background:var(--surface);min-height:108px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;text-align:left}
.mo-c:hover{background:var(--surface-2)}
.mo-c.out{background:var(--surface-2);color:var(--ink-3)}
.mo-n{font:600 12px var(--mono);margin-bottom:2px}
.mo-c.today .mo-n{color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 6px;align-self:flex-start}
.mo-e{font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid}
.mo-e.chantier{background:var(--accent-soft);border-color:var(--accent)} .mo-e.rdv{background:var(--leon-soft);border-color:var(--leon)} .mo-e.admin{background:var(--warn-soft);border-color:var(--warn)}
.mo-more{font:500 10.5px var(--mono);color:var(--ink-3);padding-left:6px}

/* ---------- catalogue / documents ---------- */
.split{display:grid;grid-template-columns:220px minmax(0,1fr);gap:var(--gap);align-items:start}
.side-list{padding:8px}
.side-i{display:flex;justify-content:space-between;align-items:center;width:100%;height:34px;padding:0 10px;border:0;background:none;border-radius:6px;color:var(--ink-2);font-weight:500;text-align:left}
.side-i span{font:500 11px var(--mono);color:var(--ink-3)}
.side-i:hover{background:var(--hover)}
.side-i.on{background:var(--accent-soft);color:var(--accent)}
.side-i.on span{color:var(--accent)}
.side-sep{border-top:1px solid var(--line-2);margin:8px 2px}
.watch{padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
.watch button{border:0;background:var(--warn-soft);border-radius:7px;padding:8px 10px;text-align:left;font-size:12px;color:var(--ink-2)}
.watch button b{display:block;color:var(--ink);font-weight:600;font-size:12px}
.input.price{width:96px;height:30px;text-align:right;font-family:var(--mono);background:transparent;border-color:transparent}
.input.price:hover{border-color:var(--line)}
.input.price:focus{background:var(--raised)}
.ftype{display:inline-grid;place-items:center;width:30px;height:36px;border-radius:5px;font:600 8.5px var(--mono);letter-spacing:.04em;position:relative;background:var(--chip);color:var(--ink-2);flex:none;clip-path:polygon(0 0,70% 0,100% 22%,100% 100%,0 100%)}
.ftype.PDF{background:var(--bad-soft);color:var(--bad)} .ftype.JPG{background:var(--info-soft);color:var(--info)} .ftype.DOCX{background:var(--leon-soft);color:var(--leon)} .ftype.XLSX{background:var(--ok-soft);color:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:16px}
.dtile{border:1px solid var(--line-2);border-radius:10px;padding:10px;background:var(--raised);text-align:left;display:flex;flex-direction:column;gap:10px;transition:.15s}
.dtile:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.thumb{height:104px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.thumb.doc::before{content:"";position:absolute;left:22%;right:22%;top:12px;bottom:-6px;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12);background-image:repeating-linear-gradient(to bottom,transparent 0 8px,var(--paper-line) 8px 9px);background-clip:content-box;padding:16px 10px 0}
.thumb.photo{background:linear-gradient(160deg,#9AA8A9 0%,#C9BBA4 55%,#8E7D66 100%)}
.thumb.photo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px)}
.dtile .dn{font-size:12.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dtile small{font:500 10.5px var(--mono);color:var(--ink-3)}
.doc-prev{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px}
.fake-page{background:var(--paper);border-radius:4px;box-shadow:var(--shadow);padding:26px;min-height:340px;display:flex;flex-direction:column;gap:9px}
.fake-page i{display:block;height:7px;border-radius:2px;background:var(--paper-line)}
.fake-page i.h{height:12px;width:45%;background:#cfc8bb}
.fake-page.photo{background:linear-gradient(160deg,#9AA8A9 0%,#C9BBA4 55%,#8E7D66 100%)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--gap)}
.tpl{display:flex;flex-direction:column}
.tpl .thumb{height:132px;margin:12px 12px 0}
.tpl-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tpl-b b{font-weight:600}
.tpl-b p{margin:0;font-size:12.5px;color:var(--ink-3);flex:1}
.tpl-b .btn{align-self:flex-start;margin-top:6px}

/* ---------- paramètres ---------- */
.set{max-width:880px}
.set-sec{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:22px 0;border-bottom:1px solid var(--line-2)}
.set-sec:first-child{padding-top:4px}
.set-sec h4{margin:0 0 5px;font-size:14px}
.set-sec p{margin:0;color:var(--ink-3);font-size:12.5px;line-height:1.5}
.trow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.trow:last-child{border-bottom:0}
.trow b{font-weight:500;display:block}
.trow small{color:var(--ink-3);font-size:12px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.th-card{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);text-align:left;transition:.15s}
.th-card:hover{border-color:var(--line-strong)}
.th-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.th-card span{display:block;font-size:12.5px;font-weight:500;padding:8px 2px 2px}
.th-prev{height:78px;border-radius:6px;display:grid;grid-template-columns:22% 1fr;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.th-prev i{display:block}
.th-prev .c{padding:9px;display:flex;flex-direction:column;gap:5px}
.th-prev .c b{height:6px;border-radius:2px;display:block}
.num-prev{font:600 22px var(--mono);color:var(--accent);letter-spacing:.02em}
.bk-list{list-style:none;margin:10px 0 0;padding:0;border:1px solid var(--line-2);border-radius:8px}
.bk-list li{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.bk-list li:last-child{border-bottom:0}

/* ---------- responsive ---------- */
@media (max-width:1640px){body.leon-open .devis-wrap,body.leon-open .editor{grid-template-columns:minmax(0,1fr)}body.leon-open .devis-wrap>.sticky,body.leon-open .editor>.sticky{position:static}}
@media (max-width:1320px){.idcard{grid-template-columns:1fr 1fr}.idcard .minis{grid-column:1/-1}.mini:first-child{border-left:0;padding-left:0}}
@media (max-width:1180px){
  body.leon-open{--leon-w:0px}
  body.leon-open .leon{position:fixed;right:0;top:0;bottom:0;width:384px;z-index:45;box-shadow:var(--shadow-lg)}
  .g2,.devis-wrap,.editor{grid-template-columns:minmax(0,1fr)}
  .st{width:240px}
}
@media (max-width:900px){
  body{--rail-w:68px}
  .rail .lbl,.rail .n,.rail .brand-txt,.rail .who-t,.rail .badge{display:none}
  .rail .nav-g{height:12px;padding:0;overflow:hidden;color:transparent}
  .rail .nav-i{justify-content:center;padding:0}
  .rail .brand,.rail .who{justify-content:center;padding-left:0;padding-right:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line-2)}
  .st .st-t,.st kbd{display:none}.st{width:36px;padding:0;justify-content:center}
  .split,.set-sec,.doc-prev{grid-template-columns:minmax(0,1fr)}
  .idcard{grid-template-columns:1fr}
  .g-head,.g-row{grid-template-columns:150px minmax(0,1fr)}
  .head-bot{flex-direction:column;align-items:stretch}
  .head-act{justify-content:flex-start;order:-1;padding:0}
}
@media (max-width:640px){
  :root{--pad-x:16px}
  .paper{padding:24px 20px}.paper-zone{padding:12px}
  .pp-grid,.form-grid{grid-template-columns:1fr}
  .wk-hd,.wk-body{grid-template-columns:40px repeat(7,minmax(64px,1fr))}
  .wk{overflow-x:auto}
  .themes{grid-template-columns:1fr}
  .leon-in,body.leon-open .leon{width:100vw!important}
}

  const d=fluxData(),W=640,pl=40,pr=8,pt=12,pb=26;
  const max=Math.max(4000,Math.ceil(Math.max(...d.map(x=>Math.max(x[1],x[2])))/4000)*4000);
  const cw=(W-pl-pr)/d.length,bw=Math.min(20,cw/4.2),y=v=>pt+(H-pt-pb)*(1-Math.max(0,v)/max);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line class="c-grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="c-lbl" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${v?Math.round(v/1000)+' k':'0'}</text>`}
  d.forEach((x,i)=>{const cx=pl+cw*i+cw/2,part=i===d.length-1?'c-part':'';
    g+=`<rect class="c-in ${part}" x="${cx-bw-2}" y="${y(x[1])}" width="${bw}" height="${y(0)-y(x[1])}" rx="2"><title>${x[0]} — encaissé ${eur0(x[1])}</title></rect><rect class="c-out ${part}" x="${cx+2}" y="${y(x[2])}" width="${bw}" height="${y(0)-y(x[2])}" rx="2"><title>${x[0]} — dépensé ${eur0(x[2])}</title></rect><text class="c-lbl" x="${cx}" y="${H-8}" text-anchor="middle">${x[0]}${part?' *':''}</text>`});
  const pts=d.map((x,i)=>[pl+cw*i+cw/2,y(x[1]-x[2])]);
  g+=`<polyline class="c-net" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map((p,i)=>`<circle class="c-dot" cx="${p[0]}" cy="${p[1]}" r="3"><title>${d[i][0]} — net ${eur0(d[i][1]-d[i][2])}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Flux de trésorerie sur six mois">${g}</svg>`;
}

function toast(msg,o={}){
  const t=document.createElement('div');t.className='toast'+(o.err?' err':'');
  t.innerHTML=`${ic(o.err?'alert':o.icon||'check')}<span>${msg}</span>${o.action?`<button class="tb">${o.action[0]}</button>`:''}`;

function leonAnswer(q){
  const s=norm(q),fm=q.match(/F-\d{4}-\d{3}/i),dm=q.match(/D-\d{4}-\d{3}/i);
  const late=lateFacs().sort((a,b)=>a.ech.localeCompare(b.ech));
  if(/relanc|rappel/.test(s)&&(fm||/factur/.test(s))){
    const f=fm?fac(fm[0].toUpperCase()):late[0];
    if(!f) return 'Aucune facture en retard : il n’y a rien à relancer pour le moment.';
    if(fReste(f)<=0) return `La facture <b>${f.id}</b> est déjà réglée, aucune relance n’est nécessaire.`;
    const c=cli(f.client);
    return `Voici une proposition de ${f.rel.length?'deuxième relance':'premier rappel'} pour <b>${esc(c.nom)}</b> (${f.id}, ${dd(TODAY,f.ech)>0?`${dd(TODAY,f.ech)} jours de retard`:'pas encore échue'}). Le ton est courtois${isPro(f.client)?' et rappelle les pénalités applicables entre professionnels':''}.`+draftBlock('rel-'+f.id,relanceText(f),lbtn('Marquer comme relancée','mark-relance',f.id)+lbtn('Ouvrir la facture','open-fac',f.id));
  }
  if(/retard|impaye/.test(s)){
    if(!late.length) return 'Aucune facture en retard. Toutes les échéances passées sont réglées.';
    return `<b>${late.length} factures</b> sont en retard, pour un total de <b>${eur(sum(late,fReste))}</b> :<ul class="l-list">${late.map(f=>`<li><span>${f.id} · ${esc(cli(f.client).nom)}<small>Échue depuis ${dd(TODAY,f.ech)} j · ${f.rel.length?`${f.rel.length} relance déjà envoyée`:'jamais relancée'}</small></span><b class="mono">${eur(fReste(f))}</b></li>`).join('')}</ul><div class="l-acts">${late.map(f=>`<button class="btn sm" data-act="leon-ask" data-q="Rédige une relance pour la facture ${f.id}">Relancer ${f.id}</button>`).join('')}</div>`;
  }
  if(/urgent|priorit|aujourd|point du jour|faire/.test(s)){
    const pr=priorities().filter(p=>!S.done.has(p.id));
    const today=DB.events.filter(e=>e.date===TODAY).sort(byDT);
    return `Aujourd’hui, ${today.length?`vous êtes sur <b>${esc(today[0].t.toLowerCase())}</b> (${esc(refName(today[0].ref))}) de ${today[0].s} à ${today[today.length-1].e}`:'aucune intervention n’est planifiée'}. Points à traiter, par ordre d’importance :<ul class="l-list">${pr.slice(0,5).map(p=>`<li><span>${p.t}<small>${p.s}</small></span></li>`).join('')}</ul><div class="l-acts">${late.length?`<button class="btn sm" data-act="leon-ask" data-q="Rédige une relance pour la facture ${late[0].id}">Relancer ${late[0].id}</button>`:''}${lbtn('Voir l’accueil','go','','data-ch="accueil"')}</div>`;
  }
  if(/urssaf|cotis|declar|provision/.test(s)){
    const u=urssafCalc();
    return `Pour le <b>3e trimestre</b>, votre chiffre d’affaires encaissé s’élève à <b>${eur(u.ca)}</b>.<ul class="l-list"><li><span>Cotisations sociales (${fr(URSSAF_TAUX)} %)</span><b class="mono">${eur(u.cot)}</b></li><li><span>Formation professionnelle (${fr(CFP_TAUX)} %)</span><b class="mono">${eur(u.cfp)}</b></li><li><span><b>À provisionner</b></span><b class="mono">${eur(u.cot+u.cfp)}</b></li></ul>La déclaration est à faire avant le <b>31 octobre</b>. J’ai planifié un créneau administratif le 30 octobre.<div class="l-acts">${lbtn('Ouvrir la Trésorerie','go','','data-ch="tresorerie"')}</div>`;
  }
  if(/treso|solde|banque|flux|argent/.test(s)){
    const so=solde(),due=DB.factures.filter(f=>!f.brouillon&&fReste(f)>0),u=urssafCalc();
    return `Le solde du compte pro est de <b>${eur(so)}</b>. Il reste <b>${eur(sum(due,fReste))}</b> à encaisser sur ${due.length} factures, dont <b>${eur(sum(late,fReste))}</b> en retard.<br><br>À prévoir : environ <b>${eur(u.cot+u.cfp)}</b> de cotisations URSSAF fin octobre. Votre trésorerie reste confortable, mais relancer ${late.length?late.map(f=>f.id).join(' et '):'les clients'} sécuriserait novembre.<div class="l-acts">${lbtn('Voir la synthèse','go','','data-ch="tresorerie"')}</div>`;
  }
  if(/creneau|dispo|libre/.test(s)){
    const slots=[];
    for(let i=0;i<10&&slots.length<3;i++){const d=addD(TODAY,i),wd=P(d).getDay();if(wd===0||wd===6)continue;
      const evs=DB.events.filter(e=>e.date===d).sort(byDT);let t=8;
      for(const e of evs){if(hm(e.s)-t>=2){slots.push([d,t]);break}t=Math.max(t,hm(e.e))}
      if(slots.length&&slots[slots.length-1][0]===d) continue;
      if(17-t>=2) slots.push([d,t]);}
    const hh=x=>`${String(Math.floor(x)).padStart(2,'0')}:${x%1?'30':'00'}`;
    return `Voici les premiers créneaux libres de 2 heures entre 8 h et 17 h :<ul class="l-list">${slots.map(([d,t])=>`<li><span>${cap(fDl(d))}<small>${hh(t)} – ${hh(t+2)}</small></span><button class="btn sm" data-act="new-ev" data-date="${d}" data-time="${hh(t)}">Planifier</button></li>`).join('')}</ul>`;
  }
  if(/planning|semaine|agenda|programme/.test(s)){
    const ws=monday(TODAY),evs=DB.events.filter(e=>e.date>=ws&&e.date<=addD(ws,6)).sort(byDT);
    return `Semaine du <b>${weekLabel(TODAY)}</b> : ${evs.length} interventions.<ul class="l-list">${evs.map(e=>`<li><span>${cap(P(e.date).toLocaleDateString('fr-FR',{weekday:'long'}))} · ${e.s}–${e.e}<small>${esc(e.t)}${e.ref?` — ${esc(refName(e.ref))}`:''}</small></span></li>`).join('')}</ul>Jeudi est chargé : démarrage chez Mme Vasseur puis rendez-vous du syndic à Arras à 17 h 30. Prévoyez le trajet.`;
  }
  if(/devis/.test(s)&&/mail|envoi|redig/.test(s)){
    const d=dm?dev(dm[0].toUpperCase()):S.id&&dev(S.id);
    if(!d) return 'Indiquez-moi le numéro du devis (par exemple D-2026-052) et je prépare le message.';
    const c=cli(d.client),t=dTot(d);
    const txt=`Objet : Votre devis ${d.id} — ${d.objet}

Bonjour ${c.salut},

Suite à notre rendez-vous, vous trouverez ci-joint notre devis ${d.id} pour ${d.objet.charAt(0).toLowerCase()+d.objet.slice(1)}, d’un montant de ${eur(t.ttc)} TTC.

Il est valable jusqu’au ${fD(addD(d.date,d.valid))}. Pour l’accepter, il vous suffit de nous le retourner signé avec la mention « Bon pour accord », accompagné d’un acompte de 30 %.

Je reste à votre disposition pour en discuter ou ajuster certains postes.

Cordialement,
${CO.dir}
${CO.nom} — ${CO.tel}`;
    return `Voici une proposition de message pour <b>${esc(c.nom)}</b> :`+draftBlock('dev-'+d.id,txt,d.statut==='Brouillon'?lbtn('Marquer le devis comme envoyé','devis-send',d.id):'');
  }
  if(/tva/.test(s)){
    const d=S.mode==='edit'?S.draft:S.id&&dev(S.id);
    if(!d||!d.client) return 'Ouvrez un devis et choisissez un client : je vérifie que les taux correspondent à la nature du local.';
    const pro=isPro(d.client),bad=d.lines.filter(l=>pro?l.tva!==20:l.tva===20);
    return bad.length?`Attention : ${pro?'le client est un professionnel, les travaux sur local professionnel relèvent en principe du taux de <b>20 %</b>':'pour un logement de plus de deux ans, les travaux de rénovation relèvent en principe du taux de <b>10 %</b>'}. ${bad.length} ligne${bad.length>1?'s':''} à vérifier :<ul class="l-list">${bad.map(l=>`<li><span>${esc(l.des||'Ligne sans désignation')}</span><b class="mono">${fr(l.tva)} %</b></li>`).join('')}</ul>`:`Les taux de TVA sont cohérents avec un client ${pro?'professionnel (20 %)':'particulier (10 % et 5,5 % pour l’isolation)'}.`;
  }
  if(/devis|transfo|attente|reponse/.test(s)){
    const w=DB.devis.filter(d=>dSt(d)==='Envoyé').sort((a,b)=>a.date.localeCompare(b.date));
    const dec=DB.devis.filter(d=>['Accepté','Refusé','Expiré'].includes(dSt(d))),acc=dec.filter(d=>dSt(d)==='Accepté');
    return `<b>${w.length} devis</b> attendent une réponse, soit <b>${eur0(sum(w,d=>dTot(d).ht))} HT</b>. Votre taux de transformation est de <b>${dec.length?Math.round(acc.length/dec.length*100):0} %</b>.<ul class="l-list">${w.map(d=>`<li><span>${d.id} · ${esc(cli(d.client).nom)}<small>Envoyé il y a ${dd(TODAY,d.date)} j · expire le ${fDs(addD(d.date,d.valid))}</small></span><button class="btn sm" data-act="open-devis" data-id="${d.id}">Ouvrir</button></li>`).join('')}</ul>Le devis ${w[0]?.id||''} expire bientôt : un appel serait plus efficace qu’un e-mail.`;
  }
  if(/chantier|avancement|rentab|point sur/.test(s)){
    if(S.ch==='travaux'&&S.id&&/ce chantier/.test(s)){const c=chn(S.id),p=chProg(c),nx=c.phases.find(x=>!x[1]),bud=chBud(c),dep=chDep(c);
      return `<b>${esc(c.objet)}</b> est avancé à <b>${p} %</b>. ${nx?`Prochaine étape : ${esc(nx[0].toLowerCase())}.`:'Toutes les phases sont terminées.'} Les dépenses engagées représentent ${eur(dep)} pour un budget de ${eur(bud)} HT, soit une marge brute estimée de <b>${bud?Math.round((bud-dep)/bud*100):0} %</b>. Fin prévue le ${fD(c.fin)} (${dd(c.fin,TODAY)} j).`}
    const act=DB.chantiers.filter(c=>chSt(c)!=='Terminé');
    const best=[...DB.chantiers].map(c=>({c,m:chBud(c)?(chBud(c)-chDep(c))/chBud(c):0})).sort((a,b)=>b.m-a.m);
    return `${act.length} chantiers actifs :<ul class="l-list">${act.map(c=>`<li><span>${esc(c.objet)}<small>${esc(cli(c.client).nom)} · fin ${fDs(c.fin)}</small></span><b class="mono">${chProg(c)} %</b></li>`).join('')}</ul>Meilleure marge brute : <b>${esc(best[0].c.objet)}</b> (${Math.round(best[0].m*100)} %). Pensez au PV de réception de la salle de bain vendredi.`;
  }
  if(/client/.test(s)&&/resum|fiche/.test(s)&&S.ch==='crm'&&S.id){
    const c=cli(S.id),fx=DB.factures.filter(f=>f.client===c.id&&!f.brouillon),du=sum(fx,fReste),dv=DB.devis.filter(d=>d.client===c.id);
    return `<b>${esc(c.nom)}</b> (${c.type.toLowerCase()}, ${esc(c.ville)}), client depuis ${P(c.depuis).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}. ${dv.length} devis, ${eur0(sum(fx,f=>f.ht))} HT facturés${du?`, <b>${eur(du)}</b> restant dû`:', aucun impayé'}.<br>À retenir : ${esc(c.notes)}`;
  }
  if(/meilleur|top client/.test(s)){
    const r=DB.clients.map(c=>({c,ca:sum(DB.factures.filter(f=>f.client===c.id&&!f.brouillon),f=>f.ht)})).filter(x=>x.ca).sort((a,b)=>b.ca-a.ca);
    return `Vos clients par chiffre d’affaires facturé :<ul class="l-list">${r.slice(0,5).map(x=>`<li><span>${esc(x.c.nom)}<small>${x.c.type}</small></span><b class="mono">${eur0(x.ca)}</b></li>`).join('')}</ul>Nord Habitat Gestion a un fort potentiel récurrent : le devis D-2026-050 mérite un suivi.`;
  }
  if(/client|relancer/.test(s)){
    const r=DB.clients.map(c=>({c,du:sum(DB.factures.filter(f=>f.client===c.id&&!f.brouillon),fReste)})).filter(x=>x.du>0).sort((a,b)=>b.du-a.du);
    return `${r.length} clients ont un solde dû :<ul class="l-list">${r.map(x=>`<li><span>${esc(x.c.nom)}<small>${x.c.tel}</small></span><b class="mono">${eur(x.du)}</b></li>`).join('')}</ul>Les plus urgents sont ceux dont la facture est échue : ${late.map(f=>esc(cli(f.client).nom)).join(', ')||'aucun'}.`;
  }
  if(/document|expir|attestation/.test(s)){
    const w=DB.docs.filter(x=>x.exp).sort((a,b)=>a.exp.localeCompare(b.exp));
    return `Documents à échéance :<ul class="l-list">${w.map(x=>`<li><span>${esc(x.nom)}<small>Expire le ${fD(x.exp)} · dans ${dd(x.exp,TODAY)} j</small></span><button class="btn sm" data-act="open-doc" data-id="${x.id}">Voir</button></li>`).join('')}</ul>Demandez dès maintenant l’attestation décennale 2027 à votre assureur : vos clients professionnels l’exigent avant tout démarrage.`;
  }
  if(/prestation|utilise|catalogue/.test(s)){
    const r=CAT.map(x=>({x,n:DB.devis.reduce((a,d)=>a+d.lines.filter(l=>l.code===x.code).reduce((b,l)=>b+l.q*l.pu,0),0)})).filter(o=>o.n).sort((a,b)=>b.n-a.n);
    return `Prestations les plus chiffrées (montant HT cumulé dans vos devis) :<ul class="l-list">${r.slice(0,5).map(o=>`<li><span>${o.x.code} · ${esc(o.x.des)}</span><b class="mono">${eur0(o.n)}</b></li>`).join('')}</ul>`;
  }
  if(/fourniture|marge/.test(s)){
    const r=FOURN.map(x=>({x,k:x.pu/x.pa})).sort((a,b)=>a.k-b.k);
    return `Fournitures dont le coefficient est le plus faible :<ul class="l-list">${r.slice(0,4).map(o=>`<li><span>${esc(o.x.des)}<small>${esc(o.x.fourn)}</small></span><b class="mono">× ${fr(o.k.toFixed(2))}</b></li>`).join('')}</ul>Sous ×1,3, la revente couvre mal le temps d’approvisionnement.`;
  }
  return `Je peux notamment :<ul class="l-list"><li><span>Faire le point du jour et prioriser vos tâches</span></li><li><span>Lister les factures en retard et rédiger les relances</span></li><li><span>Préparer le mail d’envoi d’un devis et vérifier sa TVA</span></li><li><span>Résumer votre trésorerie et estimer l’URSSAF</span></li><li><span>Faire le point sur un chantier ou trouver un créneau</span></li></ul>Essayez l’une des suggestions ci-dessous.`;
}
