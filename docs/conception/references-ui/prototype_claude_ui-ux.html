  'devis-send':el=>{const d=dev(el.dataset.id);d.statut='Envoyé';d.hist.push([TODAY,'Envoyé au client par e-mail']);DB.act.unshift({date:TODAY,type:'mail',client:d.client,t:'Devis envoyé',s:`${d.id} transmis par e-mail.`});render(false);toast(`${d.id} envoyé à ${esc(cli(d.client).email)} (simulation).`,{icon:'send'})},
  'devis-relance':el=>{const d=dev(el.dataset.id);d.hist.push([TODAY,'Relance envoyée au client']);DB.act.unshift({date:TODAY,type:'mail',client:d.client,t:'Relance devis',s:`${d.id} relancé par e-mail.`});renderView();toast(`Relance de ${d.id} envoyée à ${esc(cli(d.client).nom)} (simulation).`,{icon:'send'})},
  'devis-refuse':el=>{const d=dev(el.dataset.id);d.statut='Refusé';d.hist.push([TODAY,'Refusé par le client']);render(false);toast(`${d.id} marqué comme refusé.`,{action:['Annuler',()=>{d.statut='Envoyé';d.hist.pop();render(false)}]})},
  'devis-accept':el=>{const d=dev(el.dataset.id);d.statut='Accepté';d.hist.push([TODAY,'Bon pour accord signé']);
    if(!d.chantier){const id='CH-0'+(Math.max(...DB.chantiers.map(c=>+c.id.slice(3)))+1);DB.chantiers.push({id,client:d.client,devis:d.id,objet:d.objet,lieu:cli(d.client).adresse,debut:addD(TODAY,14),fin:addD(TODAY,21),phases:[['Protection et préparation',0],['Travaux principaux',0],['Finitions',0],['Nettoyage et réception',0]],journal:[[TODAY,'Chantier créé à la signature du devis.']]});d.chantier=id}
    if(cli(d.client).statut==='Prospect') cli(d.client).statut='Actif';
    render(false);toast(`${d.id} accepté · chantier ${d.chantier} créé dans Travaux.`,{action:['Ouvrir le chantier',()=>go('travaux','chantiers',d.chantier)]})},
  'devis-invoice':el=>{const d=dev(el.dataset.id);const id=nextFac();const f={id,client:d.client,objet:`Acompte 30 % — ${d.id}`,devis:d.id,pct:30,date:TODAY,ech:addD(TODAY,15),ht:r2(dTot(d).ht*.3),tvaR:isPro(d.client)?20:10,pay:[],rel:[]};DB.factures.push(f);d.acompte=id;render(false);openFac(id);toast(`Facture d’acompte ${id} émise : ${eur(fTTC(f))} TTC.`)},
  /* --- factures --- */
  'new-fac':()=>formModal('Nouvelle facture',[{k:'client',label:'Client',type:'select',options:clientOpts(),req:1,span:1},{k:'objet',label:'Objet',req:1,span:1},{k:'ht',label:'Montant HT (€)',type:'number',req:1},{k:'tvaR',label:'TVA',type:'select',options:[['10','10 %'],['20','20 %'],['5.5','5,5 %']]}],v=>{const ht=parseFloat(String(v.ht).replace(',','.'));if(!(ht>0)){toast('Montant invalide.',{err:1});return false}const id=nextNum(DB.factures,'BR-');DB.factures.push({id,brouillon:true,client:v.client,objet:v.objet,date:'',ech:'',ht,tvaR:+v.tvaR,pay:[],rel:[]});if(S.ch==='facturation')renderView();openFac(id);toast('Brouillon créé. Il recevra son numéro à l’émission.')},'Créer le brouillon','La facture reste modifiable tant qu’elle n’est pas émise.'),
  'fac-emit':el=>{const f=fac(el.dataset.id),id=nextFac();f.brouillon=false;f.id=id;f.date=TODAY;f.ech=addD(TODAY,30);S.fac=id;refreshFac();render(false);toast(`Facture ${id} émise · échéance le ${fD(f.ech)}.`)},
  'fac-send':el=>{const f=fac(el.dataset.id);DB.act.unshift({date:TODAY,type:'mail',client:f.client,t:'Facture envoyée',s:`${f.id} transmise par e-mail.`});toast(`${f.id} envoyée à ${esc(cli(f.client).email)} (simulation).`,{icon:'send'})},
  'mark-relance':el=>{const f=fac(el.dataset.id);f.rel.push(TODAY);DB.act.unshift({date:TODAY,type:'mail',client:f.client,t:`Relance ${f.id}`,s:`Relance n° ${f.rel.length} envoyée.`});S.done.add('pf-'+f.id);refreshFac();renderView();toast(`Relance n° ${f.rel.length} de ${f.id} enregistrée.`,{icon:'send'})},
  rap:el=>{const m=DB.mouv.find(x=>x.id===el.dataset.id);m.rap=!m.rap;el.classList.toggle('on',m.rap);el.setAttribute('aria-pressed',m.rap);el.title=m.rap?'Rapproché avec le relevé':'À rapprocher'},
  'urssaf-done':()=>{S.urssafDone=true;S.done.add('urssaf');renderView();toast('Déclaration du T3 marquée comme effectuée.')},
  'new-mv':el=>{const d=ds(el),sens=d.sens||'out';const cats=sens==='in'?['Règlement client','Autre recette']:['Fournitures','Sous-traitance','Véhicule','Outillage','Location','Assurances','Frais généraux','Cotisations'];
    formModal(sens==='in'?'Saisir un encaissement':'Saisir une dépense',[{k:'lib',label:'Libellé',req:1,span:1},{k:'m',label:'Montant TTC (€)',type:'number',req:1},{k:'date',label:'Date',type:'date',value:TODAY},{k:'cat',label:'Catégorie',type:'select',options:cats},{k:'mode',label:'Mode',type:'select',options:['Carte','Virement','Prélèvement','Chèque','Espèces']},{k:'tiers',label:sens==='in'?'Payeur':'Fournisseur'},{k:'ch',label:'Chantier',type:'select',options:chOpts(),value:d.ch||''}],v=>{const m=parseFloat(String(v.m).replace(',','.'));if(!(m>0)){toast('Montant invalide.',{err:1});return false}
      DB.mouv.push({id:'M'+(++MID),date:v.date,sens,lib:v.lib,cat:v.cat,tiers:v.tiers,mode:v.mode,m:r2(m),ch:v.ch,rap:false});render(false);toast(`${sens==='in'?'Encaissement':'Dépense'} de ${eur(m)} enregistré${sens==='in'?'':'e'}${v.ch?` sur ${v.ch}`:''}.`)},'Enregistrer')},
  /* --- chantiers --- */
  phase:el=>{const c=chn(el.dataset.id),ph=c.phases[+el.dataset.i];ph[1]=ph[1]?0:1;if(ph[1])c.journal.unshift([TODAY,`Phase terminée : ${ph[0]}.`]);renderView();renderHead();if(chSt(c)==='Terminé')toast('Toutes les phases sont terminées. Pensez au PV de réception.',{action:['Modèle de PV',()=>go('documents','modeles')]})},
  'new-ch':el=>{const d=ds(el);formModal('Nouveau chantier',[{k:'client',label:'Client',type:'select',options:clientOpts(),value:d.client,req:1,span:1},{k:'objet',label:'Objet',req:1,span:1},{k:'lieu',label:'Adresse du chantier',span:1,ph:'Par défaut : adresse du client'},{k:'debut',label:'Début',type:'date',value:addD(TODAY,7)},{k:'fin',label:'Fin prévue',type:'date',value:addD(TODAY,14)},{k:'budget',label:'Budget HT (€)',type:'number'}],v=>{if(v.fin<v.debut){toast('La date de fin précède la date de début.',{err:1});return false}const id='CH-0'+(Math.max(...DB.chantiers.map(c=>+c.id.slice(3)))+1);DB.chantiers.push({id,client:v.client,objet:v.objet,lieu:v.lieu||cli(v.client).adresse,debut:v.debut,fin:v.fin,budget:+String(v.budget).replace(',','.')||0,phases:[['Protection et préparation',0],['Travaux principaux',0],['Finitions',0],['Nettoyage et réception',0]],journal:[[TODAY,'Chantier créé.']]});go('travaux','chantiers',id);toast(`Chantier ${id} créé.`)},'Créer le chantier')},
  /* --- planning --- */
  week:el=>{const n=+el.dataset.d;S.week=n?addD(S.week,7*n):monday(TODAY);renderView()},
  month:el=>{const n=+el.dataset.d;if(!n)S.month=TODAY.slice(0,7);else{const[y,m]=S.month.split('-').map(Number);const d=new Date(y,m-1+n,1);S.month=ISO(d).slice(0,7)}renderView()},
  day:el=>{S.week=monday(el.dataset.date);go('planification','semaine')},
  slot:(el,e)=>{if(e.target.closest('.ev'))return;const r=el.getBoundingClientRect(),ph=r.height/(H1-H0);let h=H0+Math.floor((e.clientY-r.top)/ph*2)/2;h=Math.max(H0,Math.min(H1-1,h));const t=`${String(Math.floor(h)).padStart(2,'0')}:${h%1?'30':'00'}`;A['new-ev']({dataset:{date:el.dataset.date,time:t}})},
  'new-ev':el=>{const d=ds(el),s=d.time||'08:00',e=`${String(Math.min(H1,Math.floor(hm(s))+2)).padStart(2,'0')}:${s.slice(3)}`;
    formModal('Planifier une intervention',[{k:'t',label:'Intitulé',req:1,span:1,ph:'Ex. Pose des plaques'},{k:'type',label:'Type',type:'select',options:[['chantier','Chantier'],['rdv','Rendez-vous'],['admin','Administratif']],value:d.ref?'chantier':'chantier'},{k:'ref',label:'Lié à',type:'select',options:[['','Aucun'],...DB.chantiers.filter(c=>chSt(c)!=='Terminé').map(c=>[c.id,`${c.id} — ${c.objet}`]),...DB.clients.map(c=>[c.id,`Client — ${c.nom}`])],value:d.ref||''},{k:'date',label:'Date',type:'date',value:d.date||TODAY},{k:'s',label:'Début',type:'time',value:s},{k:'e',label:'Fin',type:'time',value:e}],v=>{if(v.e<=v.s){toast('L’heure de fin doit suivre l’heure de début.',{err:1});return false}
      if(hm(v.s)<H0||hm(v.e)>H1){toast(`Le planning couvre ${H0} h – ${H1} h.`,{err:1});return false}
      const ov=DB.events.find(x=>x.date===v.date&&v.s<x.e&&v.e>x.s);
      DB.events.push({id:'E'+Date.now(),date:v.date,s:v.s,e:v.e,type:v.type,t:v.t,ref:v.ref});S.week=monday(v.date);
      if(S.ch==='planification')renderView();else if(S.ch==='travaux')renderView();
      toast(`Planifié ${fDl(v.date)}, ${v.s}–${v.e}.${ov?` Chevauche « ${esc(ov.t)} ».`:''}`,{action:S.ch!=='planification'?['Voir le planning',()=>go('planification','semaine')]:null})},'Planifier')},
  'ev-del':el=>{const i=DB.events.findIndex(x=>x.id===el.dataset.id),e=DB.events[i];DB.events.splice(i,1);closeModal();renderView();toast('Intervention supprimée.',{action:['Annuler',()=>{DB.events.push(e);renderView()}]})},
  /* --- catalogue & documents --- */
  'new-art':()=>{const f=S.tab==='fournitures';const cats=[...new Set(catItems().map(x=>x.cat))];
    formModal(f?'Nouvelle fourniture':'Nouvelle prestation',f?[{k:'code',label:'Référence',req:1},{k:'cat',label:'Catégorie',type:'select',options:cats},{k:'des',label:'Désignation',req:1,span:1},{k:'fourn',label:'Fournisseur',req:1},{k:'u',label:'Unité',value:'u'},{k:'pa',label:'Prix d’achat HT',type:'number',req:1},{k:'pu',label:'Prix de vente HT',type:'number',req:1}]:[{k:'code',label:'Code',req:1,ph:'Ex. PEI-04'},{k:'cat',label:'Catégorie',type:'select',options:cats},{k:'des',label:'Désignation',req:1,span:1},{k:'u',label:'Unité',type:'select',options:['m²','ml','u','h','forfait']},{k:'pu',label:'Prix unitaire HT',type:'number',req:1},{k:'tva',label:'TVA',type:'select',options:[['10','10 %'],['20','20 %'],['5.5','5,5 %']]}],v=>{
      const code=v.code.trim().toUpperCase();if([...CAT,...FOURN].some(x=>x.code===code)){toast('Ce code existe déjà.',{err:1});return false}
      const num=k=>parseFloat(String(v[k]).replace(',','.'))||0;
      if(f)FOURN.push({code,cat:v.cat,des:v.des,u:v.u,fourn:v.fourn,pa:num('pa'),pu:num('pu')});else CAT.push({code,cat:v.cat,des:v.des,u:v.u,pu:num('pu'),tva:+v.tva});
      renderView();toast(`${code} ajouté au catalogue.`)},'Ajouter')},
  'doc-import':()=>formModal('Importer un document',[{k:'file',label:'Fichier',type:'file',req:1,span:1},{k:'cat',label:'Classement',type:'select',options:DCATS},{k:'ch',label:'Chantier lié',type:'select',options:chOpts()}],(v,fm)=>{const file=fm.elements.file.files[0];const ext=(file.name.split('.').pop()||'').toUpperCase();const type=['PDF','DOCX','XLSX'].includes(ext)?ext:/JPE?G|PNG|HEIC/.test(ext)?'JPG':'PDF';const sz=file.size>1048576?`${fr((file.size/1048576).toFixed(1))} Mo`:`${Math.max(1,Math.round(file.size/1024))} Ko`;DB.docs.push({id:'DOC'+Date.now(),nom:file.name.replace(/\.[^.]+$/,''),cat:v.cat,type,date:TODAY,taille:sz,lien:v.ch?{k:'ch',id:v.ch}:null});S.f.dcat='all';if(S.ch!=='documents')go('documents');else renderView();toast(`« ${esc(file.name)} » classé dans ${v.cat}.`)},'Importer','Le fichier reste sur cet appareil. Dans ce prototype, seuls son nom et sa taille sont conservés.'),
  'tpl-use':el=>{const t=TPL.find(x=>x.id===el.dataset.id);
    if(t.lines){newDraft('',t.lines.map(c=>L(c,1)));S.draft.objet=t.name.replace('Devis — ','').replace(/^./,c=>c.toUpperCase());go('commerce','devis',null,'edit');toast('Modèle chargé : choisissez le client et ajustez les quantités.');return}
    openModal(`<div class="modal-h"><div><div class="eyebrow">${t.kind}</div><h3 style="margin-top:3px">${t.name}</h3></div>${closeX()}</div><div class="modal-b doc-prev"><div class="fake-page"><i class="h"></i><i style="width:60%"></i><i></i><i style="width:82%"></i><i></i><i style="width:50%"></i><i></i><i style="width:74%"></i></div><div><p style="margin:0 0 12px;color:var(--ink-2)">${t.desc}</p><p class="hint">Les champs (client, montants, dates) sont remplis automatiquement depuis la pièce d’origine.</p></div></div><div class="modal-f"><button class="btn" data-act="close-modal">Fermer</button>${B('Générer un document','plus','primary','tpl-gen',`data-id="${t.id}"`)}</div>`,true)},
  'tpl-gen':el=>{const t=TPL.find(x=>x.id===el.dataset.id);DB.docs.push({id:'DOC'+Date.now(),nom:`${t.name} — ${fDs(TODAY)}`,cat:t.kind==='Chantier'?'Chantiers':'Administratif',type:'DOCX',date:TODAY,taille:'36 Ko',lien:null});closeModal();go('documents','classement');toast(`« ${t.name} » généré et classé.`)}
};
function pickRows(){const q=norm(S.q.pick);const r=CAT.filter(x=>!q||norm(x.code+' '+x.des+' '+x.cat).includes(q));return r.length?r.map(x=>`<button class="pick" data-act="pick" data-code="${x.code}"><span class="ref">${x.code}</span><span><b>${esc(x.des)}</b><br><small>${x.cat} · ${x.u} · TVA ${fr(x.tva)} %</small></span><b class="mono">${eur(x.pu)}</b></button>`).join(''):empty('Aucune prestation.')}
const LISTS={clients:clientRows,devis:devisRows,factures:facRows,chantiers:chRows,mouv:mouvRows,cat:catRows,docs:docRows,pick:pickRows};

/* =========================================================
   Thème
   ========================================================= */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){document.documentElement.dataset.theme=S.set.theme==='system'?(mq&&mq.matches?'dark':'light'):S.set.theme}
function setTheme(t){S.set.theme=t;store.set('theme',t);applyTheme();renderRail();if(S.ch==='parametres')renderView();toast(`Thème ${t==='dark'?'sombre':t==='light'?'clair':'système'} appliqué.`,{icon:t==='dark'?'moon':'sun'})}
if(mq&&mq.addEventListener) mq.addEventListener('change',()=>{if(S.set.theme==='system'){applyTheme();renderRail()}});

/* =========================================================
   Événements globaux
   ========================================================= */
document.addEventListener('click',e=>{
  const pi=e.target.closest('[data-pi]');if(pi){palRun(+pi.dataset.pi);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='palIn') return palFilter(t.value);
  if(t.dataset.search){S.q[t.dataset.search]=t.value;const el=$('#list-'+t.dataset.search);if(el)el.innerHTML=LISTS[t.dataset.search]();return}
  if(t.dataset.lf!=null&&S.draft){const i=+t.dataset.line,k=t.dataset.lf,l=S.draft.lines[i];if(!l)return;l[k]=['q','pu','tva'].includes(k)?(parseFloat(t.value)||0):t.value;t.classList.remove('err');const c=$('#lt-'+i);if(c)c.textContent=eur((+l.q||0)*(+l.pu||0));$('#ed-tot').innerHTML=totHTML();return}
  if(t.dataset.dfield&&S.draft){S.draft[t.dataset.dfield]=t.value;t.classList.remove('err');if(t.dataset.dfield==='client'&&S.leonOpen)renderLeonCtx();return}
  if(t.dataset.note){cli(t.dataset.note).notes=t.value;const s=$('#note-st');if(s){s.textContent='Enregistrement…';clearTimeout(s._t);s._t=setTimeout(()=>s.textContent='Enregistré sur cet appareil · à l’instant',400)}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.price){const it=[...CAT,...FOURN].find(x=>x.code===t.dataset.price);const v=parseFloat(t.value.replace(',','.'));if(isNaN(v)||v<0){t.value=it.pu.toFixed(2);toast('Prix invalide.',{err:1});return}it.pu=r2(v);t.value=it.pu.toFixed(2);toast(`Prix de ${it.code} mis à jour : ${eur(it.pu)} HT.`);const l=$('#list-cat');if(l&&S.tab==='fournitures')l.innerHTML=catRows()}
});
document.addEventListener('submit',e=>{
  const f=e.target;
  if(f.id==='leonForm'){e.preventDefault();const v=$('#leonIn').value.trim();if(v)leonAsk(v);return}
  if(f.dataset.pay){e.preventDefault();const fa=fac(f.dataset.pay),fd=new FormData(f),m=r2(parseFloat(fd.get('m')));
    if(!(m>0)||m>fReste(fa)+0.005){toast(`Montant invalide (maximum ${eur(fReste(fa))}).`,{err:1});return}
    fa.pay.push({date:fd.get('d'),m,mode:fd.get('mode')});
    DB.mouv.push({id:'M'+(++MID),date:fd.get('d'),sens:'in',lib:`Règlement ${fa.id}`,cat:'Règlement client',client:fa.client,mode:fd.get('mode'),m,fac:fa.id,ch:chOfDevis(fa.devis),rap:false});
    refreshFac();render(false);toast(`Règlement de ${eur(m)} enregistré · facture ${fSt(fa).toLowerCase()}.`);return}
  if(f.dataset.journal){e.preventDefault();const v=f.elements.t.value.trim();if(!v)return;chn(f.dataset.journal).journal.unshift([TODAY,v]);renderView();toast('Note ajoutée au journal.')}
});
document.addEventListener('keydown',e=>{
  const k=e.key,pal=$('#palWrap').classList.contains('open');
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){e.preventDefault();pal?palClose():palOpen();return}
  if(pal){if(k==='ArrowDown'){e.preventDefault();PAL.sel=Math.min(PAL.items.length-1,PAL.sel+1);drawPal()}else if(k==='ArrowUp'){e.preventDefault();PAL.sel=Math.max(0,PAL.sel-1);drawPal()}else if(k==='Enter'){e.preventDefault();palRun(PAL.sel)}else if(k==='Escape'){palClose()}return}
  if(k==='Escape'){if($('#modalWrap').classList.contains('open'))return closeModal();if(S.fac)return closeDrawer();if(S.leonOpen)return leonToggle(false)}
  if(e.altKey&&!e.ctrlKey&&!e.metaKey){if(/^Digit[0-9]$/.test(e.code)){e.preventDefault();go(ORDER[+e.code.slice(5)])}else if(e.code==='KeyL'){e.preventDefault();leonToggle()}}
});
$('#modalWrap').addEventListener('mousedown',e=>{if(e.target.id==='modalWrap')closeModal()});
$('#palWrap').addEventListener('mousedown',e=>{if(e.target.id==='palWrap')palClose()});

/* =========================================================
   Démarrage
   ========================================================= */
applyTheme();
document.documentElement.dataset.density=S.set.density;
if(S.set.motion) document.documentElement.dataset.motion='reduce';
if(store.get('railMin',false)) document.body.classList.add('rail-min');
render(true);
})();
</script>
